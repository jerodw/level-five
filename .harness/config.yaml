# Target-repository harness configuration
workflow: story-workflow
branch_prefix: story/
# The branch a story's branch is cut from, and the branch l5-plan expects to
# commit a plan artifact onto. Leave unset and it is the repository's own
# default branch, read from refs/remotes/origin/HEAD, which is what this
# repository uses. Set it only where the base is not the git default:
# base_branch: develop
permission_mode: acceptEdits
# model: leave unset to use the developer's default Claude Code model
stories_dir: .harness/stories
runs_dir: .harness/runs
logs_dir: .harness/logs
standards_dir: .harness/standards
architecture_docs:
  - .harness/docs/ARCHITECTURE.md
test_command: .venv/bin/python -m pytest tests/ -q -n auto
# This repository's suite census: it prints a JSON object of counter names to
# integers, and a stage declaring suite_census has it run in a clone at that
# stage's baseline and again in the tree the stage left. The counters are this
# repository's to choose and are phrased so that a larger number is a stronger
# suite; the coordinator compares integers and interprets no name. It runs
# under python3 rather than the project virtualenv because a clone is built
# from tracked files and the virtualenv is not one of them.
census_command: python3 .harness/census.py
# Where this repository's tests live. It is what the workflow's {{tests_dir}}
# token resolves to, so the stage restricted from creating tests is restricted
# here and the stage that writes them is told to write them here. There is no
# default: leave it unset and the target declares no test directory at all, and
# the restriction resolves out of the workflow entirely.
tests_dir: tests/
# The executable the clean-clone check runs the suite under. Deliberately an
# older environment than the one the developer works in, and the one CI
# exercises, so an incompatibility is found before CI rather than by it. It
# replaces the first word of test_command; absent, that first word is used.
verification_runner: .venv310/bin/python
# Bash commands stage agents may run without prompting. Everything else
# is denied in headless mode. Read-only search and inspection is granted
# broadly: a denial costs a turn and buys nothing, because the harness's
# own rules are enforced by the coordinator after a stage has run, not by
# this list. Mutation is denied by hooks/bash_guard.py, which ships with
# the harness and is passed to every stage invocation, rather than by
# these entries happening to omit it.
allowed_tools:
  - "Bash(.venv/bin/python:*)"
  - "Bash(python3:*)"
  - "Bash(chmod:*)"
  - "Bash(ls:*)"
  - "Bash(cat:*)"
  - "Bash(git status:*)"
  - "Bash(git diff:*)"
  - "Bash(git log:*)"
  - "Bash(grep:*)"
  - "Bash(rg:*)"
  - "Bash(find:*)"
  - "Bash(head:*)"
  - "Bash(tail:*)"
  - "Bash(wc:*)"
  - "Bash(sort:*)"
  - "Bash(uniq:*)"
  - "Bash(diff:*)"
  - "Bash(git show:*)"
  - "Bash(git branch:*)"
  - "Bash(git ls-files:*)"
