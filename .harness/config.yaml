# Target-repository harness configuration
workflow: story-workflow
branch_prefix: story/
# The branch a story's branch is cut from, and the branch l5-plan expects to
# commit a plan artifact onto. Leave unset and it is the repository's own
# default branch, read from refs/remotes/origin/HEAD, which is what this
# repository uses. Set it only where the base is not the git default:
# base_branch: develop
permission_mode: acceptEdits
# model: leave unset to use the developer's default Claude Code model
# How long a run paused because capacity ran out may wait in place before the
# process exits, in seconds — five hours here. It bounds a wait whose length
# the harness has been told: a signal naming a reset time within it is slept
# to and the stage re-entered, one naming a reset time beyond it exits, and one
# naming no reset time exits without sleeping at all. The pause is written and
# committed before any sleep begins, so a process killed while waiting leaves a
# run a fresh l5-run resumes at the stage it paused on.
max_pause_wait_seconds: 18000
stories_dir: .harness/stories
runs_dir: .harness/runs
logs_dir: .harness/logs
standards_dir: .harness/standards
# The parts of this repository's own source an inspection covers when the
# developer names no scope. One agent invocation is made per entry, so
# declaring them is what makes an inspection of this harness several coherent
# invocations rather than one agent handed the whole tree. Tests are inspected
# too, as a scope of their own from tests_dir below: source and tests are a
# union and not a merge, and nothing about the implementer's create
# restriction is decided here.
source_dirs:
  - orchestration/
  - scripts/
  - prompts/
  - schemas/
  - workflows/
  - hooks/
  - templates/
# This harness inspects itself as each of its own stories completes: after the
# completion commit, so a slow inspection cannot delay the durability of the
# work, and before the completion sweep, so the briefs it enqueues are filed by
# that same sweep. The scope is the files the story changed plus the files git
# tracks directly beside them, which is what makes duplication and parity gaps
# visible — both live in the file the story did not change. This bounds that
# scope in files; what the invocation may spend and how many briefs it may file
# are the two inspect_ keys the defaults above cover. Delete the key and no run
# inspects anything.
inspect_after_story_max_files: 60
# The cross-run history — the append-only logs that outlive the run
# directories they describe — is left at its default of .harness/history, and
# unlike runs_dir and logs_dir above it is versioned and blocked to every
# stage: version control decides what survives, blocked paths decide who may
# write it, and a stage must not be able to edit the record of its own
# execution.
#
# history_retention_days is deliberately left unset here, and the absence is
# a decision rather than an oversight: unset keeps the whole of this
# deployment's history, which is the evidence the records exist to preserve.
# The key is proven configurable by test rather than by the shipped value.
# history_retention_days: 90
architecture_docs:
  - .harness/docs/ARCHITECTURE.md
test_command: .venv/bin/python -m pytest tests/ -q -n auto
# How this repository files an outbox entry: the reference implementation it
# ships, installed into .harness/sync/ by l5-init and wired up here, so the
# script the harness hands to every target is the script this repository is
# itself exercised by. The harness invokes it once per entry and knows nothing
# else about the tracker — the entry on stdin, the key in L5_SYNC_KEY, the
# reference as the last non-empty line of stdout, and an exit code saying
# landed (0), retry (75) or stop (anything else). The command is idempotent
# given the key, which is what makes a lost response safe to retry, and it
# does not commit. Read .harness/sync/github.sh for the whole contract.
sync_command: .harness/sync/github.sh
# How long that command may run before it is killed, in seconds. The kill
# reaches its process group, so a command that spawned children of its own
# leaves none behind, and the entry is left pending rather than failed —
# running past a timeout establishes nothing about whether the request
# arrived. Delete the key and the bound is 60 seconds, which is a real one:
# zero here would be no timeout at all.
sync_timeout_seconds: 120
# The command the revert check substitutes a nominated test into. {test} is the
# substitution point; everything else is this repository's own selector syntax,
# which the harness neither parses nor understands. A writing stage that names
# a test failing without its change lets the check decide on that test alone —
# run once on the tree the stage left, where it must pass, and once with the
# governed edits reverted, where it must fail — instead of on a twelve-minute
# suite. Anything short of pass-then-fail falls through to the whole suite, so
# a bad nomination costs one extra selector run and changes no verdict. No
# -n auto here: one test is not worth the workers it would start.
test_selection_command: .venv/bin/python -m pytest {test} -q
# This repository's suite census: it prints a JSON object of counter names to
# integers, and a stage declaring suite_census has it run in a clone at that
# stage's baseline and again in the tree the stage left. The counters are this
# repository's to choose and are phrased so that a larger number is a stronger
# suite; the coordinator compares integers and interprets no name. It runs
# under python3 rather than the project virtualenv because a clone is built
# from tracked files and the virtualenv is not one of them.
census_command: python3 .harness/census.py
# Where this repository's tests live. It is what the workflow's {{tests_dir}}
# token resolves to, so the stage restricted from creating tests is restricted
# here and the stage that writes them is told to write them here. There is no
# default: leave it unset and the target declares no test directory at all, and
# the restriction resolves out of the workflow entirely.
tests_dir: tests/
# The executable the clean-clone check runs the suite under. Deliberately an
# older environment than the one the developer works in, and the one CI
# exercises, so an incompatibility is found before CI rather than by it. It
# replaces the first word of test_command; absent, that first word is used.
verification_runner: .venv310/bin/python
# Bash commands stage agents may run without prompting. Everything else
# is denied in headless mode. Read-only search and inspection is granted
# broadly: a denial costs a turn and buys nothing, because the harness's
# own rules are enforced by the coordinator after a stage has run, not by
# this list. Mutation is denied by hooks/bash_guard.py, which ships with
# the harness and is passed to every stage invocation, rather than by
# these entries happening to omit it.
allowed_tools:
  - "Bash(.venv/bin/python:*)"
  - "Bash(python3:*)"
  - "Bash(chmod:*)"
  - "Bash(ls:*)"
  - "Bash(cat:*)"
  - "Bash(git status:*)"
  - "Bash(git diff:*)"
  - "Bash(git log:*)"
  - "Bash(grep:*)"
  - "Bash(rg:*)"
  - "Bash(find:*)"
  - "Bash(head:*)"
  - "Bash(tail:*)"
  - "Bash(wc:*)"
  - "Bash(sort:*)"
  - "Bash(uniq:*)"
  - "Bash(diff:*)"
  - "Bash(git show:*)"
  - "Bash(git branch:*)"
  - "Bash(git ls-files:*)"
