verification_requirements:
  - Confirm that after the rename each of the six modules named in the acceptance criteria resolves the baseline and endpoint recorded there. Those values were resolved before the rename and are written into this story so they are compared against rather than trusted afterwards.
  - Confirm no assertion went vacuous. The suite passing is not sufficient evidence, because vacuity is what keeps a suite green. For a sample of renamed modules, demonstrate that a differential assertion still goes red when its subject is violated, mutating a working tree rather than a pinned revision.
  - Confirm the resolution refuses rather than guesses - a module declaring several origins, asked for a range without one, raises; and a module with no declaration resolves its own path.
  - Confirm by search over tests/ that no module is named test_story_ followed by digits, that the scan performing the search reports a planted violation, and that it leaves test_story_parser.py and test_story_coordinator.py alone.
  - Confirm the plan-time check fires on a plan naming a tests/ file called test_story_<digits>, that its message says what to name the module instead, and that the artifact is left uncommitted for the developer to repair.
  - Confirm by search that every tests/ path named in .harness/docs/ARCHITECTURE.md exists.
  - Confirm the full suite passes and reports 2002 tests, the count recorded before the rename.
  - Confirm nothing under .harness/stories/ or .harness/runs-archive/ was rewritten.

constraints:
  - No assertion in any renamed module is weakened, skipped or deleted. This story is a rename and a resolution change; an assertion that was wrong before stays wrong and belongs to another story.
  - A reference naming a path at a pinned historical revision keeps its historical spelling, because that is the name the object has at that revision.
  - The declared origin is a declaration, not a heuristic. No rename-following inference is introduced alongside it, so there is one resolution rather than two.
  - A module with no declared origin resolves exactly as it does today, so this change costs a future module nothing.
  - Committed story artifacts and the runs archive record what was true when they were written and are left alone; history describing the past accurately is not drift.
  - The scan and the renames land together. A scan added ahead of the renames fails against the files it exists to prevent, and a half-renamed suite carries two conventions with no way for a reader to tell which modules were converted.

