verification_requirements:
  - Confirm that each new driven case has a control differing in the one
    thing the case is about, so each assertion can fail.
  - Confirm that each adapted existing test changed only the expectation
    this story moves, and that the only assertions removed are the ones that
    existed solely to justify freezing configurable values in the workflow
    comparisons.
  - Confirm that no new or adapted test holds a configurable value to a
    specific value, and that the workflow comparisons stay green when a
    configurable number in a shipped workflow changes.
  - Confirm that the rule for what became of a finding is written once and
    applied to both kinds of finding.
  - Confirm that the coordinator's new inputs are read through names_a_slug,
    decision_of, the accepted verdict, the refusal's own kind and
    _live_pass_record, that the send-back goes through self_route, and that
    a checking-stage finding is filed through inspection.file_findings.
  - Confirm that a finding with a refused part comes back only when a later
    verdict makes that part, and that a rejected finding comes back only
    under a decision.
  - Confirm that nothing is filed with values the coordinator supplied in
    place of the checking stage's classification, and that a run leaving
    none of its own findings accounts, files and reports exactly as before.
  - Confirm that the rejection's event and decision-log record are written
    unchanged.
  - Confirm that both prompts carry the new sentences in the same words, and
    that the standing prompt checks pass unedited.
  - Confirm that the whole suite passes.

constraints:
  - The coordinator stays deterministic. No model call is added, and nothing
    the accounting records is read to route.
  - One rule decides what became of a finding, for the inspection's findings
    and the checking stage's own alike.
  - A finding part of whose fix a bound refused comes back only when a later
    verdict makes that part. A finding whose decision was rejected comes
    back only under a decision the coordinator accepts.
  - What the run leaves unfixed reaches the backlog through the one filing
    call, whichever stage found it, except where a decline drops it as not
    worth filing or a checking-stage finding carries no classification.
  - The coordinator never supplies a brief's judgments. A checking-stage
    finding is filed only from the classification the checking stage wrote.
  - An unanswered postponed repair is sent back once through the existing
    re-run and never escalates the run. No retry is spent on it.
  - No event kind, append_event keyword or history schema field is added.
    Every move is reported in the existing accounting and self-route event
    kinds.
  - A run whose verdicts carry none of the new inputs and leave none of the
    checking stage's own findings records the same slugs and counts, and
    writes the same events, as it does today. The only difference in its
    accounting artifact is the new fields on each left entry.
  - Both writers of a left entry record the new fields alike, explicitly on
    every entry, in the convention dropped and abandoned follow.
  - The rejection's decision-rejected event and its decision-log record are
    written exactly as before.
  - Both verifier prompts carry every new sentence in the same words, so the
    parity checks need no new permitted divergence.
  - The completion report's layout and its decisions part are unchanged.
  - The retry ceiling is unchanged.
  - No test holds a configurable value to a specific value.

