verification_requirements:
  - Confirm a run whose every sweep fails - a transport that raises on every
    entry, with the queue seeded pending - passes pre-flight, runs every stage,
    commits its work, completes, and exits with the status it would have had
    with an empty queue.
  - Confirm the sweep call sites cannot refuse by inspecting the function they
    call: it returns a Summary on every path, raises on none, and neither
    coordinator call site reads anything from its result.
  - Confirm each way a sweep can go wrong returns a summary carrying the reason
    - a bad timeout, a bad limit, an absent transport, a transport that raises,
    a transport that answers with nonsense, and a queue that cannot be listed.
  - Confirm the pre-flight sweep runs below the history prune and above the
    first stage invocation, and that a run refused by a pre-flight above it
    leaves the queue untouched.
  - Confirm the completion sweep runs after the completion commit and not
    before, by observing the ordering rather than by reading the source.
  - Confirm an escalated run and a paused run each sweep nothing, and that
    their entries are still there for a later run or an l5-sync.
  - Confirm the bound is obeyed: a queue of more pending entries than the limit
    attempts exactly the limit, leaves the rest pending and unattempted, and
    names the limit and the remainder in what it reports.
  - Confirm the bound counts filings and not reads: a queue of landed, failed
    and poisoned entries is fully reported under a limit smaller than it.
  - Confirm l5-status reports pending counts, failed entries with their last
    error and poisoned files, and that it builds no transport and files
    nothing - including with sync_command configured, where a sweep would
    otherwise have had one to build.
  - Confirm scripts/l5-sync behaves exactly as it did before this story for
    every case it already covered, including its exit rule and its refusal of a
    sync_timeout_seconds that is not a positive number.
  - Confirm the declared config keys and the keys the harness reads are still
    equal in both directions, and that sweep_max_entries has a proof varying it
    to a value that is neither the default nor this repository's own.
  - Confirm the two retired assertions have successors rather than deletions:
    the modules naming the queue are exactly the declared set, a stale
    exemption is reported, a planted call site is reported, and
    story_coordinator.py still calls neither outbox.sync nor outbox.enqueue.
  - Confirm the whole suite passes under the configured test command, including
    the tests this story adds, and that no test in it reaches a network.

constraints:
  - No change to the entry states, to the entry schema, or to the transport
    contract. A sweep files what the outbox already knows how to file.
  - No retry backoff policy beyond what the outbox already defines. If backoff
    turns out to be needed it is a finding for a later story rather than
    something invented here.
  - l5-sync stays the explicit entry point and its behaviour is unchanged. The
    sweeps this story adds are additional, never a replacement.
  - A sweep never blocks, delays or refuses a run. Durability first, network
    second, and no call site reads a sweep's result to decide anything.
  - l5-status stays instant and works offline. It parses no payload, builds no
    transport and makes no network call.
  - No silent cap. Whatever a bound leaves undone is named in what the sweep
    reports.
  - No third-party dependency, and no test that reaches a network. Every
    transport in the suite is a fake.
  - orchestration/command_transport.py is not modified. The sweep uses the
    transport the previous story settled rather than widening it.

