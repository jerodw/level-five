    - .github/workflows/tests.yml

verification_requirements:
  - Confirm an implementer edit that a legitimate change forces is permitted, by constructing one - a modification without which the suite fails - and showing the check permits it and records why.
  - Confirm an implementer edit that adds coverage is escalated, demonstrated by a test function that passes both before and after the implementer's change, so the only thing distinguishing it from a repair is that reverting it costs nothing.
  - Confirm a deleted governed path is decided the same way, in both directions - a deleted test the change broke is permitted, a deleted test that still passes is escalated.
  - Confirm a run whose implementer record names no governed path performs no extra work, by the absence of the artifact and by the check building no clone.
  - Confirm the granularity limit by constructing the case it misses - a set mixing a forced repair with added coverage - and showing the check reports what it checked rather than claiming more.
  - Confirm the escalation reason names the stage, the prefix and the governed paths in both events.log and escalation-summary.md, and that retry_count is unchanged by it.
  - Confirm the check is driven entirely by the loaded workflow definition and the story, by removing the revert_check declaration and observing the check disappear with no code change, and by grepping orchestration/story_coordinator.py for the stage name, the prefix and the artifact name.
  - Confirm the story's granted prefixes are subtracted before the check runs, so a story holding a stage exception for a prefix is not subject to the revert check on it.
  - Confirm the clean-clone check is unaffected - same artifact, same events, same routing - with the revert parameter defaulting to reverting nothing.
  - Confirm the new schema is listed in schemas/manifest.json, appears in no stage's schemas map, and that no orchestration code routes on the record.
  - Confirm the planner guidance reaches a rendered prompt by rendering prompts/planner.md through orchestration/context_assembler.py, not by reading the template, and that planner.md still names no stage and no restricted prefix.
  - Confirm no story artifact under .harness/stories/ was edited, and that no test in the suite depends on the prose rule this story supersedes.
  - Confirm the full suite passes, in the working tree and in the clean clone.

constraints:
  - This story is not governed by the check it adds. The coordinator loads the workflow definition at run start, so the revert_check declaration written by this story's implementer will not be in the definition its own run already holds - the same gap story-007 hit with may_not_create and story-014 hit with clean_clone. Enforcement begins with the next story. This is expected, not a defect.
  - Do not change may_not_create enforcement or any other declaration in the workflow definition. The creation rule is correct and has held throughout; this story adds a decision about modifications beside it, it does not replace it.
  - Do not change the clean-clone check's behavior. The added parameter defaults to reverting nothing, and every artifact, event and routing decision that check drives stays exactly as it is.
  - Do not write a second clone builder. The check is story-014's existing clone operation with the governed paths restored from HEAD instead of applied.
  - Do not edit story-008, story-009, story-011, story-012 or story-013. They are execution records of what was written, not the source of it, and this story does not retroactively correct them.
  - Do not add planner prompt guidance as the enforcement. The one line this story adds is a courtesy; the enforcement is the revert check. A written rule in an injected document has already been tried in this repository and failed, which is what tests/test_baseline_honesty.py exists because of.
  - Do not close the mechanical hole at plan time. A story whose verification requirements restate a stage's may_not_create prefix more strictly than the workflow declares it is a planning error that .harness/requests/11-plan-time-validation.md proposes catching when the artifact is written. This story makes the requirement harmless; that one stops it being written.
  - This story's own verification requirements must not restate the tests/ restriction more strictly than the workflow declares it. That would be the exact error the story exists to defuse.
  - The check decides on the whole set of governed paths in one run. Do not add per-file or per-hunk reversion, and do not imply the check discriminates at a granularity it does not - state the limit where the check is defined, the way tests/test_baseline_honesty.py states its own narrowness.
  - This does not replace the negative-control guidance. An implementer could weaken an assertion as part of an otherwise-forced repair, and reverting still fails; that is covered by prompts/verifier.md and by the verifier reading the diff, which it has done correctly in every recorded instance.
  - The record is evidence, never state. Nothing routes on it, exactly as nothing routes on clean-clone-result.json or retry-history.json.
  - Like clean-clone-result.json, the record is not archived on a retry, because it is named in no stage's outputs, changed_files or schemas map. That is a known cost carried deliberately, not an oversight to fix here.
  - No test may be weakened or skipped to make the check pass, and any assertion this story adds about an absence needs a negative control demonstrating it can fail.
