story:
  id: story-063
  title: A run has a cost ceiling
  description: |
    Nothing bounds what a run may spend. max_retries bounds how many attempts
    exist and max_self_routes bounds how many times a stage re-runs in place,
    but neither is a statement about money: a single stage invocation has cost
    more than a whole story, and the counters did not move while it did.

    This story gives a run two cost ceilings and gives every run a recorded
    total of what it cost. The number already exists: every stage invocation
    ends with a result record carrying total_cost_usd, which the runner parses
    and discards. The change is to carry it, not to compute it, and never to
    re-derive it by reading the log back.

    The two ceilings divide the work deliberately. The per-execution ceiling
    stops one runaway call: every invocation of a stage is handed the same
    allowance, passed to the agent CLI as --max-budget-usd, whatever that
    stage has already spent. The run ceiling stops runaway repetition: the
    entry's total spend is compared against it before a stage is invoked.

    The per-execution ceiling is per invocation rather than cumulative because
    a cumulative stage ceiling starves a legitimate retry. This harness's
    self-routes are stages that did their work and failed to write their
    artifacts, and the re-run has to redo that work; handing it a remainder
    invites it to fail again for a new reason. Ten self-routes have occurred
    in the last several runs, so that is the common case rather than an edge
    one. Repetition stays bounded by max_self_routes and max_retries, which
    cap how many times a stage runs at all, and by the run ceiling. A third,
    cumulative per-stage ceiling was considered and rejected as redundant
    against those, and because stage dominance is a normal shape for
    legitimate work: story-053's tester was 77% of that run and was correct.

    One consequence follows from the per-execution allowance being flat, and
    the documentation states it rather than leaving a reader to discover it:
    the run ceiling is a gate checked before an invocation, not a hard cap on
    the total, so a run can finish above max_run_cost_usd by at most one
    execution allowance. Reducing the handed allowance to the run's remainder
    would close that gap and would reintroduce the starvation this design
    exists to avoid, so it is not done.

    A ceiling checked only between stages would be a gate and nothing more,
    because the invocation that runs after the gate opens would be unbounded,
    and the sharpest evidence here is a single implementer invocation that
    spent $14.12 before its connection dropped. The per-execution allowance is
    what makes a ceiling a ceiling: it is enforced inside the invocation as
    well as before it.

    Two things here go beyond what the book states, and the harness says so
    rather than presenting them as the book's. The split between a live
    allowance and a recorded total is this repository's; the book has usage
    tracking as one undivided thing. And the allowance resetting when a run is
    re-entered is a reading of the book's silence rather than its text. That
    reading is the rule the other counters already follow after story-062 -- a
    live counter is policy and resets when a human re-enters a run, a record
    accounts and does not -- so the cost allowance is an instance of that rule
    rather than an exception to it. The ceiling bounds what an unattended
    execution may spend; a human typing l5-run is the authorization to spend
    another allowance.

    Absent means unbounded, which is today's behaviour. Zero is a different
    value and means a deliberate refusal to run at all. This story also sets
    the shipped values, so the deployment runs under ceilings rather than
    waiting for a target to opt in, and each declared value carries a sibling
    reason recording its derivation where a reader of the definition meets the
    number -- the logs the figures came from are gitignored and reach no clone.

tasks:
  - Carry the cost the runner already receives. AgentResult gains a cost_usd field, defaulted to None, populated from the total_cost_usd the result event carries. The default is what leaves every fake runner in the suite unchanged.
  - Let the runner be given a budget. run_agent gains an optional max_budget_usd parameter and passes it to the agent CLI as --max-budget-usd when it is set, so an invocation stops itself rather than being stopped afterwards. Unset, the command is exactly the command it is today.
  - Hand each invocation its allowance. Before invoking a stage, the coordinator passes that stage's declared max_execution_cost_usd as the budget, unmodified by what the stage or the run has already spent. When the stage declares no ceiling it passes no budget at all, and the runner is called with exactly the arguments it is called with today.
  - Distinguish an invocation that stopped on its budget from one that failed mechanically, so a budget-truncated stage does not self-route and spend the money again.
  - Declare both ceilings in the workflow definition. A workflow-level max_run_cost_usd and a per-stage max_execution_cost_usd, both optional.
  - Set the shipped values. max_run_cost_usd 90; max_execution_cost_usd 30 for the implementer, 75 for the tester, 10 for the documenter, 30 for the verifier. Each carries a sibling reason string, in the shape max_self_routes_reason established, stating the derivation.
  - Validate the declared ceilings at pre-flight, beside the routing table and the self-route budgets, so a definition that cannot work is refused before a stage is spent on it. A declared ceiling must be a non-negative number and must not be a bool. Zero is accepted.
  - Keep the live allowance in state.json as the entry's total spend -- one number, since the run ceiling is the only cumulative comparison and no per-stage total is accumulated anywhere.
  - Reset the allowance where a resume resets the other live counters, and add nothing to what a re-entry archives -- the record accounts for the whole run and stays at the run root.
  - Write the record. A cost.json at the run root, appended once per invocation that reports a cost, carrying the run total and one entry per invocation with the stage, the entry, the attempt and the cost. Add its schema and its manifest entry.
  - Refuse when the run ceiling is reached. Immediately above the call that invokes the stage agent, compare the entry's spend against the run ceiling.
  - Stop the run on a ceiling through the existing escalation path, so the commit, the summary and the resume path are unchanged, but record it with its own event kind so a reader can tell a budget stop from an escalation about the work.
  - Record a budget stop on state.json and exempt it from the unchanged-since-escalation guard, which would otherwise refuse the resume this story exists to allow.
  - Report the accumulated spend when a run is resumed, and say when the resume is the decision to fund another allowance.
  - State the run total in the completion report and in the escalation summary.
  - Cover the ceilings, the allowance, the record and the resume with tests that drive a fake runner reporting recorded costs.
  - Document both ceilings, the division between them, the allowance-and-record split, that a run may finish above the run ceiling by at most one execution allowance, and how a ceiling is enforced both before an invocation and inside it.

acceptance_criteria:
  - AgentResult carries the cost the result event reported, and constructing one without a cost is still valid and yields None.
  - run_agent given a budget passes it to the agent CLI as --max-budget-usd, and run_agent given none builds exactly the command it builds today, with no budget argument anywhere in it.
  - A stage that declares max_execution_cost_usd is handed exactly that value as its budget, and is handed the same value on a later invocation after it has already spent -- a second invocation of a stage that spent most of its allowance on the first is handed the full allowance again, not a remainder.
  - The budget a stage is handed is not reduced by what the run has left, so a run near its run ceiling still hands a full execution allowance to the stage it invokes.
  - A stage that declares no max_execution_cost_usd is invoked with no budget argument at all, so a runner that accepts only today's arguments is still called correctly.
  - An invocation that ended having spent its whole allowance is treated as a budget stop rather than as a mechanical failure. It does not self-route, and the stage is not invoked again.
  - A workflow that declares no ceiling anywhere produces a run indistinguishable from today's -- no refusal, no change in routing, and no change to the arguments the runner is called with.
  - The shipped workflow declares max_run_cost_usd 90 and declares max_execution_cost_usd for every stage -- implementer 30, tester 75, documenter 10, verifier 30 -- and every declared value passes the pre-flight validator.
  - Every declared ceiling in the shipped workflow has a sibling reason string beside it, and nothing in the coordinator reads those reason keys.
  - A workflow-level max_run_cost_usd that is not a non-negative number, or that is a bool, is refused at pre-flight with a message naming the workflow and the offending value, leaving no run directory, no state.json and no branch, and invoking no agent.
  - A per-stage max_execution_cost_usd is refused at pre-flight on the same terms, with a message naming the stage.
  - A run whose entry spend has reached or passed the declared max_run_cost_usd does not invoke the next stage. It ends with the run's spend and the ceiling both named in the reason.
  - A budget stop appends an event whose kind is distinct from the kind an escalation about the work appends, and that kind is one the execution-history schema declares.
  - A ceiling of zero refuses before any agent is invoked at all, and an absent ceiling is a different internal value from a ceiling of zero rather than the same one.
  - state.json carries the entry's total spend as the live allowance, and no per-stage cumulative total is kept anywhere in state.
  - cost.json records one entry per invocation that reported a cost, with the stage, the entry, the attempt and the cost, and a total. It validates against its schema, and its schema is listed in the manifest.
  - The total cost.json reports equals the sum of the invocation costs for that run, across a run in which a stage was invoked more than once.
  - A resume zeroes the allowance -- a run stopped on the run ceiling resumes and proceeds rather than stopping again on the same spend -- while cost.json continues from where it stood rather than restarting at zero.
  - cost.json stays at the run root when a re-entry archives the entry's artifacts, so a resumed run's record still accounts for the invocations of every earlier entry.
  - A resume reports the accumulated spend recorded so far, and a resume of a run that stopped on a ceiling says that resuming funds a fresh allowance.
  - A run that stopped on a cost ceiling is resumable even when the story, the branch and the harness are all establishably unchanged, which the unchanged-since-escalation guard refuses for every other escalation.
  - A completed run's completion report states what the run cost, and an escalated run's summary does the same.
  - The documentation states that the two ceilings bound different things -- the per-execution allowance bounds one call, the run ceiling bounds repetition -- that a run may therefore finish above the run ceiling by at most one execution allowance, and says which of the two a reader is looking at when a run stops.

technical_plan:
  implementation_steps:
    - Add cost_usd to AgentResult with a None default and populate it in run_agent from the result event's total_cost_usd, alongside the result text already read there.
    - Add max_budget_usd to run_agent as an optional keyword, appending --max-budget-usd to the command when it is set, in the shape the model and allowed-tools arguments already take.
    - Add cost_ceiling_problems to the coordinator, beside self_route_problems and reading the same loaded workflow -- the workflow-level max_run_cost_usd and every stage's max_execution_cost_usd -- and call it at pre-flight beside the other two validators, refusing in the shape _refuse_bad_self_routes takes.
    - Add entry_cost_usd to RunState as the total spent in the current entry, defaulted to zero so a state file written before it existed still loads. Add the flag recording that the run stopped on a ceiling, defaulted false.
    - Add the cost record -- its path, its load, and the append that adds one invocation and rewrites the total -- beside the retry-record helpers, and add schemas/cost-record.schema.json and its manifest entry.
    - Above the runner call, compare entry_cost_usd against the workflow ceiling. An absent ceiling compares nothing. Route a breach through _escalate with the new event kind, having set the flag that records the stop.
    - Pass the invoked stage's declared max_execution_cost_usd to the runner as max_budget_usd, unmodified. The keyword is passed only when that stage declares one, so a stage under no ceiling calls the runner with exactly the arguments it passes today and every fake runner in the suite keeps its signature.
    - Below the runner call, add the reported cost to entry_cost_usd and append the invocation to cost.json. An invocation that reports no cost adds nothing to either.
    - Then, before the mechanical-failure checks, ask whether this invocation's own reported cost reached the allowance it was handed. It did, and the run stops on the ceiling; it did not, and the existing checks decide as they always have. Deciding it from the recorded cost rather than from the result event's own wording keeps the harness off a string it does not own, and keeps a budget stop out of the self-route path that would otherwise re-run the stage and spend the money again.
    - Add the new event kind to the execution-history schema's enum.
    - Declare the values in workflows/story-workflow.json -- max_run_cost_usd 90 at the workflow level, max_execution_cost_usd on each stage -- each with a sibling reason string carrying the derivation recorded in the next steps. The figures come from 23 runs, story-040 through story-062, summing total_cost_usd across every agent invocation in the harness logs; those logs are gitignored and reach no clone, so the reason strings are the only place the derivation survives and they must state the numbers rather than gesture at them.
    - The run ceiling's reason. Run totals across those 23 runs -- median $15.12, p90 $55.79, max $124.98. The largest legitimate run was story-053 at $67.88; story-048's $124.98 escalated. $90 sits above the first with a third of margin and below the second, so exactly one run in twenty-three would have stopped, and it is the one that escalated anyway. State also the principle behind all five numbers, since it is what a later reader needs in order to tighten them correctly: a cap that would have fired on work we were glad to have is set too low. These are the first ceilings this deployment has run under, they fail by truncating an agent mid-work, and there is no cost.json corpus yet -- so they are set at clearly pathological rather than merely unusual, and tightened later against the record this story starts writing.
    - The per-execution reasons. Per invocation across the same runs -- implementer n=30 p50 $4.36 p90 $13.09 max $18.78; tester n=35 p50 $3.27 p90 $12.99 max $52.56; documenter n=34 p50 $1.30 p90 $2.07 max $3.10; verifier n=40 p50 $1.76 p90 $6.26 max $19.07. The tester's $75 is the deliberate one -- its expensive invocations are story-053's single legitimate $52.56 conversion and four from story-048's failing run, and no cap distinguishes them, so $75 leaves the legitimate one alone while stopping a call at well past the worst ever seen. The verifier's observed maxima, $19.07 and $18.99, were both story-059 and both caused by the verifier starting a full suite run it could not wait for, which prompts/verifier.md now prevents; its real distribution is likely tighter and $30 is generous on purpose.
    - In the resume branch, clear entry_cost_usd where retry_count and verification_iterations are cleared, clear the stopped-on-cost flag, and append the note reporting the accumulated total and the fresh allowance.
    - Exempt a run carrying the stopped-on-cost flag from the unchanged_since_escalation guard, at the call site where the guard's result is acted on, so the guard itself keeps saying only what it establishes.
    - Confirm that the artifacts a re-entry moves do not include cost.json, and that the run total is stated in the completion report and the escalation summary.
    - Write the tests, each building the workflow it needs and driving a fake runner that reports recorded costs, except where the shipped definition is itself the subject.
    - Document the ceilings and the split in ARCHITECTURE.md, and add cost.json to the run directory anatomy and cost-record to the schema list.
  likely_file_changes:
    - file: orchestration/agent_runner.py
      stage: implementer
      reason: AgentResult gains the cost field, run_agent reads total_cost_usd off the result event it already parses, and run_agent gains the budget it passes to the CLI.
    - file: orchestration/story_coordinator.py
      stage: implementer
      reason: The pre-flight validator, the live allowance on RunState, the cost record, the run-ceiling refusal above the invocation, the allowance handed to each invocation, the budget stop, the resume reset and report, and the totals in the two reports.
    - file: workflows/story-workflow.json
      stage: implementer
      reason: The shipped ceilings and their reason strings are declared here -- max_run_cost_usd at the workflow level and max_execution_cost_usd on each stage.
    - file: schemas/cost-record.schema.json
      stage: implementer
      reason: New -- the shape of the run's recorded cost.
    - file: schemas/manifest.json
      stage: implementer
      reason: The new schema is listed there.
    - file: schemas/execution-history.schema.json
      stage: implementer
      reason: The event kind a budget stop appends has to be one the enum declares.
    - file: tests/test_cost_ceiling.py
      stage: tester
      reason: New -- the two ceilings, the flat allowance each invocation is handed, the pre-flight refusals, the allowance-and-record split across a resume, and the zero-versus-absent distinction.
    - file: tests/test_stage_tool_grants.py
      stage: tester
      reason: The command run_agent builds is asserted there against a fake Popen, and it now carries a budget argument when one is given and none when one is not.
    - file: tests/test_shipped_workflow_is_valid.py
      stage: tester
      reason: A fourth pre-flight validator now decides whether the shipped definition is well-formed, and the shipped definition now declares ceilings and reasons this module holds it to.
    - file: tests/test_coordinator_contract.py
      stage: tester
      reason: Where the coordinator's state fields and event kinds are held to their contract, both of which this story adds to.
    - file: tests/test_artifact_schemas.py
      stage: tester
      reason: The new schema and its manifest entry are held to the same coverage assertion every other schema is.
    - file: tests/test_execution_history.py
      stage: tester
      reason: The new event kind appears in the structured history and is asserted there.
    - file: tests/test_escalation_resume.py
      stage: tester
      reason: A budget stop is a resumable stop with an exemption from the unchanged guard, which is this module's subject.
    - file: .harness/docs/ARCHITECTURE.md
      stage: documenter
      reason: The two ceilings and what each bounds, the live-allowance and recorded-total split, the overshoot the flat allowance permits, cost.json in the run directory anatomy, and the new schema in the schema list.

scope:
  modify:
    - orchestration/agent_runner.py
    - orchestration/story_coordinator.py
    - workflows/story-workflow.json
    - schemas/
    - tests/
    - .harness/docs/ARCHITECTURE.md
  do_not_modify:
    - orchestration/harness_config.py
    - orchestration/context_assembler.py
    - orchestration/run_status.py
    - orchestration/plan_validation.py
    - scripts/
    - prompts/
    - README.md

verification_requirements:
  - Confirm a definition that declares no ceiling behaves exactly as it does today, including the arguments the runner is called with and the command run_agent builds from them. This is the compatibility property and it is the one most easily lost.
  - Confirm the shipped definition declares max_run_cost_usd 90 and the four per-stage values, that every one of them passes the pre-flight validator, and that each carries a reason string no code reads.
  - Confirm the per-execution allowance is flat: a stage invoked a second time after spending most of its first allowance is handed the whole allowance again, and the allowance is not reduced by what the run has left. This is the property this replan exists to establish and the one a remainder-based implementation would silently violate.
  - Confirm run_agent turns the allowance into --max-budget-usd, since that is what makes the ceiling enforced inside the invocation rather than only before it.
  - Confirm an invocation that exhausted its allowance stops the run on the ceiling rather than being read as a mechanical failure, so it does not self-route and spend the allowance again.
  - Confirm a run whose entry spend has passed the declared run ceiling refuses to enter the next stage, that the refusal names the ceiling and the spend, and that the event it appends is distinguishable in events.log from an escalation about the work.
  - Confirm the allowance and the record behave differently across a resume, both halves. A resumed run gets a full allowance again, so a run stopped on cost resumes and proceeds rather than stopping again, while its recorded total continues from where it stood rather than restarting at zero.
  - Confirm the resume reports the accumulated spend, since that is what makes the reset a decision rather than an accident.
  - Confirm the total the harness reports matches the sum of the result records for that run, against a run with at least one retry so more than one invocation of a stage is counted.
  - Confirm a ceiling of zero refuses before any agent is invoked, and that an absent ceiling and a zero ceiling are not the same value internally.
  - Confirm a malformed ceiling is refused at pre-flight, leaving no run directory and invoking no agent, and that the validator is shown to report a violating definition rather than only to pass a clean one.
  - Confirm a run that stopped on a ceiling resumes with the story, the branch and the harness all unchanged, and that every other escalation is still refused on that evidence.
  - Confirm cost.json validates against its schema and survives a re-entry at the run root.
  - Confirm the full suite passes, including every test that existed before this story.

constraints:
  - The cost is read from the result event the runner already parses. Nothing re-derives it by reading the log back, which would be a second parser of the harness's own output.
  - The per-execution allowance is flat. No cumulative per-stage total is kept, compared or subtracted anywhere; a stage's allowance is the same on its first invocation and its last.
  - The allowance handed to an invocation is not reduced by the run's remainder. The run ceiling is checked before an invocation and bounds repetition, not the size of a single call.
  - No routing decision reads the history or the cost record. state.json remains the coordinator's only routing source, and every routing decision stays reconstructable from state.json and events.log.
  - The coordinator stays deterministic and calls no model. Only agent_runner.py talks to one, and the tests substitute a fake runner.
  - Absent is unbounded. A run under a definition declaring no ceiling is unchanged in every observable way, including its artifacts, its event stream, and the arguments the runner and the agent CLI are given.
  - A budget stop is decided from the cost the harness recorded, never from the wording of a result the harness does not own.
  - Zero and absent are different values internally, not one falsy value serving both.
  - The live allowance and the recorded total are two facts with two lifetimes, and one name does not serve both.
  - Nothing rewrites, repairs or prunes the cost record. It is evidence, and a re-entry leaves it at the run root.
  - max_retries and max_self_routes are untouched. Cost is a peer of the retry ceiling and is not derived from it.
  - A budget stop is a reason to stop, never a reason to wait. Nothing here retries, sleeps or backs off.
  - The ceilings are declared in the workflow definition, which is one place. No ceiling value is read from the execution rules or from the target's configuration.
  - Every declared ceiling carries a sibling reason string, and no code reads those keys. They record the judgement where a reader of the definition meets the number.
  - Tests build the workflow they need rather than reading the shipped definition, except where the shipped definition is itself the subject.
  - No existing assertion is weakened, skipped or deleted to make the suite pass.
