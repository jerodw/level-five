verification_requirements:
  - Confirm that a stage declaring no budget still escalates on all three mechanical failures, so landing this changes nothing until a workflow opts in — that is the compatibility property and it must be shown against a stage rather than argued.
  - Confirm a stage declaring a budget self-routes once, and that a second consecutive mechanical failure at that same stage escalates naming both the failure and the exhausted budget.
  - Confirm the count resets on success, by succeeding at a stage and then failing mechanically again later in the same run.
  - Confirm retry_count, max_retries, attempts/attempt-N/, retry-history.json and the rendered attempt-N filenames are all untouched by a self-route — the two-budget separation is the thing a future reader will most want proven rather than asserted.
  - Confirm the re-run prompt carries the coordinator's own statement of what was missing or stale, and that the crashed-process case says the previous invocation exited without completing rather than naming an output.
  - Confirm no self-route evidence reaches the prompt of a stage that did not self-route, including a later stage in a run where an earlier one did.
  - Confirm the stage baseline is reused rather than re-captured, by showing the revert check still decides against the tree the stage first found.
  - Confirm the implementation matches the three passages quoted in this story's description, and report any place it departs from them.
  - Confirm the pre-flight refusal for a malformed budget leaves no run directory, no state.json, no log, no new branch and invokes no agent.
  - Confirm the new tests fail against the pre-story code for the reason each states, and that the repointed story-022 assertions still hold the escalation for a stage with no budget.

constraints:
  - A self-route spends neither retry_count nor max_retries, and reads neither.
  - A self-route archives nothing under attempts/attempt-N/ and appends nothing to retry-history.json.
  - A self-route never re-captures the stage baseline: the baseline is captured once per stage per attempt and reused, which is the same capture-once rule resume relies on.
  - Boundary violations and schema violations still escalate, and no escalation point other than the three named here changes behaviour.
  - No stage name, prefix, artifact name or budget value is written into orchestration code: the budget comes off the loaded stage dict, exactly as may_not_create and clean_clone do.
  - The evidence is an artifact on disk, not only a prompt string, so a run directory can say why a stage ran twice.
  - Existing state.json files still load: the new field is defaulted, and a missing value means no self-route has occurred.
  - Existing tests are repointed at the behaviour that replaced what they asserted rather than deleted, and every property they held is still held by something.
  - The implementer does not create new files under tests/; the tester writes the new test module, as the standing convention has it.
  - Optional fields on the new artifact are expressed by absence rather than by null, as clean-clone-result and execution-history already do.
