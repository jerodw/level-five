scope:
  modify:
    - tests/
    - .harness/docs/ARCHITECTURE.md
  do_not_modify:
    - orchestration/
    - workflows/
    - schemas/
    - scripts/
    - prompts/
    - config.yaml
    - .github/

verification_requirements:
  - Confirm by running the sixth rule's scan that it reports only the modules the declared list still names, and that the four subject entries are the same four with the same reasons.
  - Confirm PENDING_CEILING equals the pending count reached, and that no module left the pending class by being reclassified a subject reader.
  - Confirm each converted module still fails when the behaviour it names is violated, by planting a violation per module and observing the failure -- a conversion that went vacuous is indistinguishable from a good one otherwise.
  - Confirm each converted module's surviving test names match what it carried before this story, and that every removal is named and argued rather than silent.
  - Confirm the retired duplicate is gone, that the test above it now carries a constant with the messiness of real prose, and that it still reports the added text.
  - Confirm the new helper coverage proves repository_file_at, function_source_at and revision_carrying over a rename, a revert-and-restore, a squash and a file with no history, and that each case fails when the helper it proves is broken.
  - Confirm the five resolvers in tests/conftest.py have the same signatures and the same behaviour they had before.
  - Confirm the converted modules pass against a clone whose history is truncated below what the removed reads required, run rather than reasoned about.
  - Confirm the five rules preceding the sixth report what they reported before, and that the sixth rule's controls and stated limits are otherwise unchanged.
  - Confirm the full test suite passes.

constraints:
  - No converted assertion changes what it claims. This story changes where a test's evidence comes from.
  - A module leaves the pending class by being converted, never by being reclassified a subject reader.
  - The ceiling records the count this story honestly reached. An empty pending list is the target and not a requirement, and a module whose read resists conversion stays pending rather than being argued away.
  - The five resolvers in tests/conftest.py keep their behaviour and their signatures.
  - The four declared subject readers keep their reads and their recorded reasons.
  - The sixth rule's scan and its controls keep detecting what they detect. A conversion is a change to the modules the scan reports, never to the scan.
  - No test is skipped, weakened or deleted to make a conversion pass.
