story:
  id: story-165
  title: Two runs in flight at once merge without contending for the history a third one wrote
  description: |
    Every run appends its cross-run history records to the same four tracked
    files under .harness/history — execution-log.jsonl, inspection-log.jsonl,
    mandate-log.jsonl and retry-log.jsonl — on its own story branch. Two
    branches that both ran therefore add different lines at the same end of
    the same file, and every merge between them conflicts in every log each
    run touched. This already happens one run at a time: the rebases of
    story-136, story-143 and story-158 each conflicted on the mandate log and
    then on the execution and inspection logs, and each was resolved by hand
    as the union of both sides. With runs in flight together it is a conflict
    on every merge, which is what blocks running two stories at once.

    This story moves where the lines are written, and nothing about what they
    say. A record goes into a segment named for the writer that produced it:
    a run's records, and the mandate record l5-plan writes for the same story,
    go to .harness/history/<story-id>/<log>.jsonl, and a broad-mode inspection,
    which has no story to name, goes to a segment named for the moment it ran.
    A log kind is then the gathering of every file of that name under the
    history directory — the root-level file, which holds every record written
    before this story and stays exactly where it is, plus one per segment. Two
    branches never append to the same file, so a merge has nothing to
    reconcile, and each run still writes its history as it goes, so a crash
    mid-run still leaves a record a reader can trust.

    The census that chose this shape: three writers, all through one function
    (append_history_records in orchestration/story_coordinator.py) — the run
    through append_event, l5-plan through plan_mandate.record, and broad-mode
    l5-inspect through inspection.record; one reader of content, the prune at
    run start; two helpers that only compute which files to stage,
    plan_mandate.commit_records and inspection.record_paths; and nothing under
    scripts/ that reads a log. A merge=union attribute was considered and
    declined because it lives outside the harness — a target lacking it
    regresses silently, and this repository merges through pull requests where
    the driver may not be honoured. Deriving the history from commits was
    declined as more than the brief needs.

    This story was planned from the brief filed under 212.
  workflow: story-workflow

tasks:
  - Give the history one resolver for where a record goes and one for which files hold a log, so that a record for a story is written to .harness/history/<story-id>/<log>.jsonl, a record with no story is written to a segment named for the moment it was written, and a log kind is read as the root-level file of that name, if present, followed by every segment's file of that name in sorted segment order.
  - Route append_history_records through the writer-side resolver, keeping its append-only opening and its schema-driven selection of which logs a record reaches.
  - Make prune_history read every file the reader-side resolver names for each log, refuse on a malformed line naming the file and the line number as it does now, and rewrite only the files it actually dropped records from.
  - Make plan_mandate.commit_records and inspection.record_paths stage the segment files the record was written to rather than the root-level log paths.
  - Correct the sentences in schemas/cross-run-history.schema.json descriptions that name .harness/history/<log>.jsonl as the path a record is written to, changing no property, enum, required list or field description of what a record carries.
  - Adapt the existing tests that read or plant records at the root-level log paths to the segment layout, without weakening what they assert.
  - Add a test that completes two stories from one base on two branches, each carrying a mandate record and a run's records, and shows that merging one into the other reports no conflict and that the gathered logs afterwards hold both stories' records.
  - Record the layout, the census that chose it and the alternatives declined in .harness/docs/ARCHITECTURE.md.

acceptance_criteria:
  - A run of story X writes its execution-log, retry-log and inspection-log records to .harness/history/X/<log>.jsonl and writes nothing to .harness/history/<log>.jsonl.
  - The mandate record l5-plan writes for story X is written to .harness/history/X/mandate-log.jsonl, and commit_records stages that path.
  - A broad-mode inspection writes its record to a segment directory whose name is not a story id and is derived from the time it was written, and record_paths stages that path.
  - A test completes two stories from one base on two branches in a real git repository with a fake runner, merges the second branch into the first, and asserts that git reports no conflict and that every record either branch wrote is present in the gathered logs of the merged tree.
  - Records already present in the root-level .harness/history/<log>.jsonl files are read by the prune and by the gather exactly as records in a segment are, and this story's run leaves those files byte-for-byte unchanged.
  - prune_history with a retention bound set drops older records from whichever file holds them and rewrites only the files it dropped from; with the bound unset it rewrites nothing; and a malformed line in any segment refuses the run naming that file and line number with nothing rewritten.
  - The append path still opens a log for appending and never for writing, and tests/test_cross_run_history.py's assertion of that property still holds against the source.
  - No module under orchestration/ names a log file outside the declaration-driven resolvers; which kinds reach which log is still read from schemas/cross-run-history.schema.json and nowhere else.
  - The records a run writes are still written as the events occur through append_event, and every terminal path still commits the records it wrote, as tests/test_a_run_commits_the_history_it_writes.py asserts.
  - No property, enum, required list or field description in schemas/cross-run-history.schema.json changes; only the sentences naming the path a record is written to.

technical_plan:
  implementation_steps:
    - Add beside history_dir in orchestration/harness_config.py a resolver for the segment a record with a given story id goes to, and the name a record with no story id gets, spelled once so that the run, l5-plan and l5-inspect resolve the same path.
    - In orchestration/story_coordinator.py, make append_history_records write to the resolved segment file, creating the directory as it does now, and add a reader-side resolver returning, for each declared log, the root-level file if present followed by each segment's file in sorted segment order.
    - Rewrite prune_history over that list of files, parsing every file of every log before rewriting any, and returning dropped counts keyed by the file relative to the history directory so the announcement names the file that was rewritten.
    - Point plan_mandate.commit_records and inspection.record_paths at the segment paths through the same resolver, so what is staged is what was written.
    - Correct the path sentences in the schema's descriptions.
    - Adapt the tests that plant or read records at the root-level paths, keeping every assertion; then write the two-runs-merge test and the segment-layout assertions in a new module under tests/.
    - Add the ARCHITECTURE.md section.
