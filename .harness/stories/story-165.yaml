scope:
  modify:
    - orchestration/story_coordinator.py
    - orchestration/harness_config.py
    - orchestration/plan_mandate.py
    - orchestration/inspection.py
    - schemas/cross-run-history.schema.json
    - tests/
    - .harness/docs/ARCHITECTURE.md
  do_not_modify:
    - .harness/history/
    - orchestration/story_ids.py
    - orchestration/outbox.py
    - orchestration/worktrees.py
    - schemas/execution-history.schema.json
    - schemas/story.schema.json
    - workflows/
    - prompts/
    - scripts/
    - rules/

verification_requirements:
  - Confirm the full suite passes under the configured test command.
  - Confirm the two-runs-merge test performs a real git merge of two branches that each completed a run and each carry a mandate record, and that its assertion of no conflict is read off git's own exit status or index state rather than off the absence of an exception.
  - Confirm a run's records land under .harness/history/<story-id>/ and that the root-level .harness/history/<log>.jsonl files in this repository are unchanged by this story's own run.
  - Confirm the prune reads the root-level files and every segment, and that the malformed-line, unset-bound and dropped-records cases in tests/test_cross_run_history_retention.py still hold with every assertion intact.
  - Confirm the census reports no fall in assertion count for any adapted test module.
  - Confirm no module under orchestration/ spells a log filename outside the declaration-driven resolvers, as tests/test_cross_run_history.py asserts.
  - Confirm schemas/cross-run-history.schema.json differs from its previous version only in description strings.

constraints:
  - What a record carries does not change: every field, enum and required list in schemas/cross-run-history.schema.json stays as it is.
  - A record is still written through append_event as the event occurs; nothing assembles history at completion.
  - The append path opens files for appending only; the prune remains the only reader and the only rewriter, and it refuses rather than repairs.
  - The records already in the root-level .harness/history/<log>.jsonl files are neither moved, rewritten nor re-read differently from records in a segment; migrating them is not this story's work.
  - Story-id reservation, the outbox queue, worktree separation and scratch directories are already safe under concurrency and are not touched.
  - How many runs a machine should host at once is a separate question and is not addressed here.
  - No existing assertion is weakened, skipped or removed; adaptations change where a test reads a record, not what it asserts about it.

