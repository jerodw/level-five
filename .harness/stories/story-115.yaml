story:
  id: story-115
  title: A story carries its brief's key, and three moments report it
  description: |
    A brief filed in a tracker is what a human looks at to know what is
    happening, and today it never moves. It is filed once, planned once, and
    left exactly as filed while a story is written from it, run, and finished
    with an open pull request, so a reader of the tracker sees a backlog of
    things nobody has started while the only record of the truth is a run
    directory on one developer's machine.

    Nothing links a story back to its brief. brief_fetch states the current
    contract outright at orchestration/brief_fetch.py:41-46 -- the brief is a
    plan-time input, nothing stores it or reads it back, and the only trace of
    it after the planning session is its key in the story's description, as
    prose. There is no field on the story artifact holding that key, so a run
    has nothing to update even if it wanted one; grep brief scripts/l5-run
    orchestration/story_coordinator.py returns nothing, because the run side of
    the harness has never heard of a brief.

    This adds the write side for a story that was planned from a brief: the
    artifact carries the key, a fourth configured command is told which of
    three moments the work has reached, and three call sites tell it. THE
    HARNESS MUST NOT KNOW WHAT A STATUS IS. It knows a key and a moment, and a
    target-supplied command decides what that means in its tracker -- an issue
    label, a project-board column, a row in a markdown table, a row in a
    database. That is the seam sync_command and filed_query_command already
    stand on: one JSON document on stdin, an exit code as the answer, and no
    harness knowledge of the tracker beyond that. So this is a configured
    command and the module that invokes it, rather than three special cases
    written into three call sites.

    The three moments are planned, when the planning session's artifact is
    committed; in_progress, when the run for that story begins; and
    ready_to_merge, when the run completes. The tokens on the wire are those
    snake-case ones rather than display text, because a target's script
    compares them and the harness's other seams are spelled that way -- the
    outbox's own states are pending, landed and failed. What a tracker does
    with each of the three is the command's business, and no status is ever
    parsed back.

    IN_PROGRESS IS ANNOUNCED ON A FRESH RUN ONLY, and that is a decision rather
    than an omission. A resumed run has already been announced, and the
    coordinator has no way to know whether the tracker moved the item on since;
    re-announcing on every escalated, crashed and capacity resume would make
    the harness the author of a status history nobody asked for. The cost is
    stated: a story that escalated and was resumed shows no fresh movement in
    the tracker for the second half of its life, and the moment that follows is
    the completion.

    A STATUS UPDATE THAT FAILS MUST NOT FAIL THE THING IT REPORTED ON. A run
    that finished is finished whether or not its tracker heard, and the
    plan-time update happens after the artifact is already committed and
    pushed, so refusing there would refuse a session whose work has landed.
    Every site reports and continues, and where each one reports is part of
    what this story is checked on -- particularly the completion site, which
    must report on stderr and append nothing, because a line appended after the
    completion commit leaves the tree dirty for the next run's clean-tree
    pre-flight to refuse, which is the rule the completion sweep beside it
    already follows.

    This is the first half of a larger request. The second half -- a session
    given typed request text filing a brief for itself, so that after l5-plan
    every story has a tracker item behind it -- is filed separately and is not
    in scope here. This one is useful on its own; that one is not useful
    without it.

    This request is the brief filed under
    https://github.com/jerodw/level-five/issues/160.
  workflow: story-workflow

tasks:
  - Declare brief_key in schemas/story.schema.json as an optional top-level string holding the key of the brief the story was planned from, opaque and sent exactly as it was given, saying that it is written by l5-plan rather than by the planner and that a story planned from typed request text carries none.
  - Declare status_command and status_timeout_seconds in schemas/harness-config.schema.json, in the idiom sync_command and sync_timeout_seconds are written in, saying what the question document carries, that the exit code is the whole answer, that a tail of stderr is carried back, that no status is parsed back, and that an unset command disables the whole feature without announcing or refusing anything.
  - Write orchestration/brief_status.py, the module that resolves those two keys and invokes the command: one JSON document on stdin carrying the key and the status, the key also in the environment as L5_STATUS_KEY taken from the same field as the copy on stdin, the command spawned in its own session so a timeout's kill reaches its process group, and a bounded tail of stderr carried back in what it returns.
  - Make that module total, in the shape orchestration/outbox_sweep.py's sweep already has: it returns what happened on every path, raises into no caller, and offers no value a call site could read as "stop". An absent command, one that cannot be launched, one that exits non-zero, one that runs past its timeout and an unreadable timeout all come back as a result carrying a reason.
  - Give the module the plan-time write as well - the function that records a brief key on a story artifact by appending it, never rewriting one already there - and the reader that takes it back off a parsed story, so the writing and the reading of that field live in one place.
  - Call it from scripts/l5-plan with the status planned, after the artifact commit and the push have both succeeded and before the run offer, reporting what happened on stdout and leaving the script's exit status untouched.
  - Record the brief key on each artifact in scripts/l5-plan's report, beside the mandate stamp - after the approval and before the validation - so the artifact that is validated and committed is the one carrying the key, and a rejected session's artifact is left exactly as the session wrote it.
  - Call it from the coordinator with the status in_progress at the pre-flight sweep, on a fresh run only, decided by the same loaded state that decides the resume, and report what happened into the run's events.log through the coordinator's own append.
  - Call it from the coordinator's _complete with the status ready_to_merge, beside the completion sweep, reporting on stderr and appending nothing to any log.
  - Write templates/status/github.sh as the reference implementation beside the sync and query ones, with a header stating the whole contract, and install it through scripts/l5-init the way the other two are installed.
  - Comment status_command and status_timeout_seconds into templates/config.yaml beside the sync keys, with the reasoning a target reads before setting them.
  - Write the standing regression module for this behaviour, covering the artifact field, the module's totality, the three call sites and where each one reports.
  - Add the proofs for status_command and status_timeout_seconds to the declared-config-keys module, so neither key is read without being proven to be obeyed.
  - Record in the architecture document what a brief key on a story artifact is for, the three moments, the failure policy, and why in_progress is announced on a fresh run only.

acceptance_criteria:
  - With no status_command configured, l5-plan, a fresh run and a completing run each invoke nothing, announce nothing and refuse nothing, and behave exactly as they did before this story.
  - A story artifact carrying no brief_key causes no status command to be invoked at any of the three call sites, whatever status_command is set to.
  - A planning session started with --brief writes the fetched key into the committed artifact's brief_key field, byte for byte as it was given, with no resolution, normalization or joining against the target root.
  - A planning session given request text rather than --brief commits an artifact carrying no brief_key field at all, and the artifact still satisfies the story schema.
  - The brief key is recorded on the artifact after the developer's approval and before the plan-time validation, so an artifact refused by that validation and an artifact a developer rejected are both left in the working tree with the key recorded or not exactly as that ordering implies, and nothing is committed in either case.
  - With a status_command configured, l5-plan invokes it once after the artifact commit and push succeed, handing it a single JSON document on stdin whose key field is the story's brief_key and whose status field is the string planned.
  - The command is given the brief key in its environment as L5_STATUS_KEY, and that value is taken from the same field as the copy on stdin, so the two cannot disagree.
  - A fresh run of a story carrying a brief_key invokes the command once with the status in_progress, and a resumed run - escalated, crashed or capacity-paused - invokes it not at all.
  - A run that completes invokes the command once with the status ready_to_merge.
  - A status command that exits non-zero, that cannot be launched, that runs past its timeout, or that is configured with a timeout that is not a positive number leaves l5-plan's exit status unchanged, does not refuse a run, does not fail a run that reached completion, and is reported with a reason naming which of those it was.
  - A status command that runs past its timeout is killed together with the children it spawned, so a command that backgrounded a process leaves none of them behind.
  - A tail of what the command said on stderr is carried into what is reported, bounded in length.
  - The plan-time failure is reported on l5-plan's stdout; the run-start failure is reported in the run's events.log; the completion failure is reported on stderr and appends nothing to events.log, execution-history.json or any other file.
  - The completion call site leaves the working tree exactly as clean as it was after the completion commit, so a target that tracks its run directory is not refused by the next run's clean-tree pre-flight.
  - The status module raises into no caller for any behaviour of the configured command, including one that cannot be launched, one that exits non-zero, one that is killed on its timeout and one that writes nothing at all.
  - templates/status/github.sh exists, is installed executable into a target's .harness/status/ by l5-init, and its header states the contract the harness relies on: what stdin carries, what the environment carries, and what the exit code means.
  - Both new configuration keys are declared in schemas/harness-config.schema.json and each carries a proof in the declared-config-keys module that varies it to a value the harness would never pick and observes the harness obey it.
  - No harness code branches on the value of a status token beyond composing the document, and nothing reads a status back out of the command.

technical_plan:
  implementation_steps:
    - Add brief_key to schemas/story.schema.json as a top-level optional string. Top-level rather than nested inside the story object because l5-plan writes it by appending, the way plan_mandate.block does; inserting a line into an existing indented block would be text surgery on a session's artifact for no gain. Its description says the key is opaque, that l5-plan writes it because a key a model retypes into prose is a key that can be retyped wrong, and that its absence is ordinary.
    - Add status_command and status_timeout_seconds to schemas/harness-config.schema.json, written against sync_command and sync_timeout_seconds as the model since this is a write to the same tracker rather than a read of it. Say that the harness attaches no meaning to a status token, that unset disables the feature entirely, and that a failed update never fails the thing it reported on.
    - Write orchestration/brief_status.py holding the two configuration key constants, the three status tokens as named constants, the default timeout, a resolve_settings in filed_query.resolve_settings's shape returning a settings-or-problem pair, and an announce that spawns the command with start_new_session, writes the JSON document to its stdin, kills the process group on a timeout, and returns a frozen result carrying whether it was attempted, whether it was delivered, and the reason it was not.
    - Give brief_status.py the plan-time half too - a function that appends a brief_key line to a story artifact and reports whether it did, refusing rather than rewriting where the artifact already carries one, and a reader that takes the key off a parsed story - so the field's writer and its readers cannot drift about its name.
    - In scripts/l5-plan, thread the brief key from main into report, record it on each artifact immediately after the mandate stamp, and announce planned after the push succeeds and before offer, printing what happened in the l5-plan idiom and returning the same status the script would have returned without it.
    - In story_coordinator.run_story, capture whether this entry is a fresh run from the state already loaded for the resume decision, and announce in_progress beside the pre-flight sweep, appending what happened through append_event.
    - In story_coordinator._complete, announce ready_to_merge beside the completion sweep, printing what happened on stderr and appending nothing, for the reason the sweep there reports into no run directory.
    - Write templates/status/github.sh, moving the item for a key to the column or label the three tokens map to, with a header in the reference scripts' idiom stating the contract, and extend scripts/l5-init's template loop so the status directory is created and the script installed executable beside the sync and query ones.
    - Comment the two keys into templates/config.yaml beside the sync block, saying what each moment means, that the tokens are the command's to interpret, and that deleting the command switches the whole thing off.
    - Write tests/test_a_brief_follows_its_story.py against a fake command that records the documents it was given, covering the artifact field, the three call sites, the fresh-run-only rule, the reporting sinks and every failure mode the module absorbs.
    - Add the two keys' proofs to the declared-config-keys module, and record the mechanism in the architecture document.
  likely_file_changes:
    - file: schemas/story.schema.json
      stage: implementer
      reason: declares brief_key as an optional top-level string on the story artifact.
    - file: schemas/harness-config.schema.json
      stage: implementer
      reason: declares status_command and status_timeout_seconds, and what the harness does and does not know about a status.
    - file: orchestration/brief_status.py
      stage: implementer
      reason: the new module - resolving the two keys, invoking the command, recording the key on an artifact and reading it back.
    - file: scripts/l5-plan
      stage: implementer
      reason: records the brief key on the artifacts it is about to validate and commit, and announces planned once the commit and push have succeeded.
    - file: orchestration/story_coordinator.py
      stage: implementer
      reason: announces in_progress on a fresh run beside the pre-flight sweep, and ready_to_merge beside the completion sweep.
    - file: templates/status/github.sh
      stage: implementer
      reason: the reference implementation of the status contract, beside the sync and query ones.
    - file: scripts/l5-init
      stage: implementer
      reason: creates the status directory and installs the reference script executable, as it already does for sync and query.
    - file: templates/config.yaml
      stage: implementer
      reason: comments the two new keys in with the reasoning a target reads before setting them.
    - file: tests/test_a_brief_follows_its_story.py
      stage: tester
      reason: the standing regression module for the field, the module's totality, the three call sites and where each reports.
    - file: tests/test_config_keys_are_obeyed.py
      stage: tester
      reason: the proofs the two new configuration keys are obeyed, which the declared-keys scan requires of every declared key.
    - file: .harness/docs/ARCHITECTURE.md
      stage: documenter
      reason: records what a brief key on a story artifact is for, the three moments, the failure policy, and why in_progress is announced on a fresh run only.

scope:
  modify:
    - schemas/story.schema.json
    - schemas/harness-config.schema.json
    - orchestration/brief_status.py
    - orchestration/story_coordinator.py
    - scripts/l5-plan
    - scripts/l5-init
    - templates/status/github.sh
    - templates/config.yaml
    - tests/
    - .harness/docs/ARCHITECTURE.md
  do_not_modify:
    - schemas/story-brief.schema.json
    - orchestration/outbox.py
    - orchestration/outbox_sweep.py
    - orchestration/command_transport.py
    - orchestration/filed_query.py
    - orchestration/brief_fetch.py
    - templates/sync/github.sh
    - templates/query/github.sh

verification_requirements:
  - Confirm that with no status_command configured nothing is invoked and nothing is announced at any of the three sites, and that a story artifact carrying no brief_key invokes nothing whatever the command is set to.
  - Confirm that the document handed to the command carries the brief key exactly as it was given and one of the three tokens, and that L5_STATUS_KEY carries the same value as the document's key field.
  - Confirm that a fresh run announces in_progress and that an escalated, a crashed and a capacity-paused resume each announce nothing.
  - Confirm that every failure of the command - a non-zero exit, a launch failure, a timeout, a timeout value that is not a positive number - leaves l5-plan's exit status unchanged, refuses no run, and fails no run that reached completion, and that each is reported with a reason naming which it was.
  - Confirm that the completion call site appends to no file, so the working tree after a completed run is exactly as clean as the completion commit left it.
  - Confirm that the status module raises into no caller for any behaviour of the configured command.
  - Confirm that both new configuration keys are declared and that each carries a proof varying it to a value the harness would never pick.
  - Confirm that the regression module fails when the fresh-run-only rule, the reporting sinks or the totality of the module is broken, rather than passing on a behaviour it does not exercise.

constraints:
  - The harness attaches no meaning to a status token beyond composing the document that carries it. No harness code may branch on which token was sent to decide anything about a tracker, and no status is ever parsed back out of the command.
  - The key is opaque. Nothing resolves it, normalizes it, joins it against the target root, checks that it exists or decides anything from its form, which is exactly how brief_fetch already treats it.
  - A status update may never block, delay past its timeout, or refuse a plan, a run or a completion. Every path through the new module returns what happened, and no call site branches on it to stop anything.
  - The completion call site appends to no log and writes no file, because a write after the completion commit is what the next run's clean-tree pre-flight refuses on - the rule the completion sweep beside it already obeys.
  - The planner is not asked to write brief_key. It is written by l5-plan, which already holds the key, for the reason the mandate block is written by l5-plan: a required field a model retypes is a field that can be retyped wrong.
  - Nothing about the outbox changes. A status update is not queued and not retried, so a command exiting 75 is reported as having asked for a retry nothing will make, rather than being made durable.
  - The existing behaviour of sync_command, filed_query_command and brief_fetch is untouched, including the plan-time instruction that puts the brief's key in the story's description as prose.

