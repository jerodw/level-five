    - scripts/l5-sync
    - scripts/l5-plan

verification_requirements:
  - Confirm the total query returns an answer and never raises for every
    failure mode the story names - absent, unlaunchable, non-zero, timed out,
    unparseable, schema-invalid, over-long and over-count - by running each
    against a real fake command rather than by reading the source.
  - Confirm nothing-known and nothing-filed are distinguishable. A command
    answering with an empty list and a command that failed produce answers
    that differ in the flag and agree in the item list.
  - Confirm the command receives the paths it was asked about as a single JSON
    document on stdin, by having a fake command record what it read.
  - Confirm the timeout kills. A command that sleeps past the configured
    timeout produces a bounded answer in bounded time, and the test observes
    the elapsed time rather than the argument list.
  - Confirm every bound names what it left out - the item cap, the per-field
    length bound and the stdout quantity bound each appear in the answer with
    what they excluded.
  - Confirm a command printing anything alongside its JSON document is
    nothing-known rather than best-effort parsed, so a target cannot half-work.
  - Confirm the three declared keys and the keys the harness reads are still
    equal in both directions, and that each new key has a proof varying it to
    a value that is neither the default nor this repository's own.
  - Confirm the reference pair agrees: the marker templates/sync/github.sh
    writes for a path is the marker templates/query/github.sh searches for,
    asserted by reading both files.
  - Confirm templates/sync/github.sh files a payload carrying no paths exactly
    as it did before this story, so the addition is additive.
  - Confirm a freshly initialized target has both templates installed.
  - Confirm orchestration/outbox.py and orchestration/command_transport.py are
    byte-for-byte unchanged by this story.
  - Confirm no target-stack literal, provider name or tracker vocabulary
    entered harness source, using the scan that already enforces it.
  - Confirm the whole suite passes under the configured test command,
    including the tests this story adds, and that no test reaches a network.

constraints:
  - The harness learns nothing about any tracker. No provider is named, no
    endpoint is built, no credential is read and no status vocabulary is
    interpreted. What the command answers is recorded and passed on.
  - Whether a closed item suppresses a refiling is the answering command's
    policy. The harness must not encode it, must not infer it, and must not
    add a field that would let it start.
  - A failed query costs dedupe and costs nothing else. It never raises into
    a caller, never blocks, never refuses and never fails a run.
  - The question is scoped. No listing operation is added, and no call site
    may ask for everything, because the cost of that grows with the tracker
    rather than with the code being asked about.
  - No silent bound. Every limit names what it excluded in the answer it
    returns.
  - Every path through the query is bounded in time. There is no unbounded
    wait and no zero timeout, which would be the same thing.
  - The filing path is not widened. orchestration/command_transport.py keeps
    the contract story-091 settled, and this story reads beside it rather than
    through it.
  - No third-party dependency, and no test that reaches a network or a real
    tracker. Every command in the suite is a fake the test wrote.
  - This story ships no caller. Nothing in a run, a plan or a sweep invokes
    the query, and a test asserts that the seam is unreferenced so the next
    story's addition is visible as an addition.

