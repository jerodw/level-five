verification_requirements:
  - Confirm the harness side did not move. orchestration/outbox.py, orchestration/outbox_sweep.py and orchestration/item_update.py are unchanged, and the changes to orchestration/filed_query.py are confined to its docstring. No configuration key was added, removed or renamed, and no schema gained or lost a field.
  - Confirm the three call sites still read what they read. The sync command's reference is still the last non-empty line of its stdout, the query command's answer is still one JSON document on its stdout, the item command's stdout is still unread, and the exit codes each call site interprets are unchanged - in particular that exit 75 still means retry at the sync call site and that neither of the other two gained a code read as a retry.
  - Confirm the merged file resolves a field name identically for the sync branch and the item branch, by driving both against a board whose field name differs from the configured one in case, and confirm that the item branch's behaviour before this story was the verbatim comparison this removes.
  - Confirm the dispatcher performs none of the three jobs when its first argument is unrecognised or absent, and exits non-zero in both cases.
  - Confirm the markers are unchanged as strings, so items filed by the scripts this story removes are still found by the file that replaces them.
  - Confirm .harness/scripts/github.sh and templates/scripts/github.sh differ only in constant assignments, and that the control planting a non-constant difference is reported.
  - Confirm a freshly initialized target gets .harness/scripts/ holding what templates/scripts/ holds, executable, and gets none of .harness/sync/, .harness/query/ or .harness/item/.
  - Confirm no assertion was lost. Read the implementer's census result and confirm no counter fell, and confirm by inspection that each assertion the three scripts' tests made was retargeted at the merged file rather than deleted.
  - Confirm nothing outside .harness/stories/, .harness/history/ and .harness/runs/ still names the six removed paths.

constraints:
  - The three failure rules at the call sites are properties of the call site and not of where the code lives. A failed sync is retried, a failed query costs only dedupe, and a failed item update stops nothing. None of them changes.
  - The sync branch stays idempotent given the key - it searches for the key before it creates anything, and an invocation that finds an existing issue falls through to the board work rather than answering and returning. The item branch stays idempotent given the story id - the projection lives between markers naming the story, replaced where they are found and appended where they are not.
  - The item branch must not disturb the markers the sync branch writes and the query branch searches for. It replaces only the region between its own markers and appends after everything else, and a question carrying a status and no document rewrites no body at all.
  - The sync branch sets a Status only where it finds one empty, and the item branch writes over whatever the field already says. That difference is deliberate and survives the merge.
  - The template names no project number and no target-specific field or column value. Those live in the installed copy alone.
  - The query branch prints one JSON document on stdout and nothing else, and says everything else on stderr.
  - No branch commits to the repository.
  - Whether these values should live in config.yaml rather than at the top of the merged file is a separate decision and is not made here.
  - Whether an installed copy should be held byte-identical to its template is filed on its own brief. This story converts the item assertion to the constants-only comparison because there is no longer a separate item script, and rules on nothing beyond that.
  - .harness/census.py stays where it is. Moving it into .harness/scripts/ is filed as its own brief.

