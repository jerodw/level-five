  - The prompt scripts/l5-plan renders for a planning session carries each
    new statement, and every statement it made before still stands apart
    from those this story rewrites — the role layer's bound, step 3's
    sentence about a problem the plan can be written around, and step 7's
    list — and the found-nothing rule, which it extends.
  - The story schema declares gaps_left as a list of strings outside the
    required list; the descriptions this story extends carry their new
    statements and keep every one they made; every committed story artifact
    still parses and validates.
  - Each refusal reports its defect and passes its control, through
    plan_validation and end to end through l5-plan, and l5-run's pre-flight
    lets an artifact carrying either defect past its story checks.
  - The approval display prints each gap beneath its artifact's line and
    above the question, and an artifact with none prints what it printed
    before.
  - The guard reads a slashed pair of hyphenated words as no file and still
    reads the planning launcher as one, and the statements about the
    shipped scripts are true — judged by reading the guard and exercising
    it, since a change to validation is not held by a test of its own.
  - The honesty entry records the module's history reads.
  - No run, retry, resume, pre-flight or reviewing-stage behaviour changed:
    nothing under orchestration/ reads gaps_left outside plan validation and
    the reader the display in l5-plan uses.
  - The whole suite passes.
  - The account .harness/docs/ARCHITECTURE.md gives matches what the
    prompt, the schema, plan validation and l5-plan now do.

constraints:
  - Nothing in a run reads gaps_left; the coordinator's run path, l5-run's
    pre-flight and the stage that checks a run behave exactly as before.
  - Whether a gaps_left entry carries a reason is decided by
    carries_a_reason, reached through the alias plan_validation already
    has; whether a path is blocked is decided by is_blocked against the
    rules file the coordinator enforces; plan_validation adds no walk of its
    own over an entry.
  - l5-plan stays a thin entry point. It reads each artifact once through
    the coordinator's reader, adds no reader of artifact text, and owns only
    the wording of what it prints.
  - The planner template still names no workflow stage, no restricted path
    and no brief category of its own; no sentence naming a story-schema
    field uses required, optional or mandatory; the do_not_modify key with
    its colon appears once, in the skeleton, whose do_not_modify item and
    description placeholder are unchanged.
  - In the consequence step the questions read as they do now and every
    dashed item is still one of them; the found-nothing rule changes only by
    the demand for the questions about other texts; the new statements sit
    outside that rule and name no file and none of the places the sweep
    searches; every numbered step is still found by the words it opens
    with. The sweep step is unchanged.
  - No document quotes a whole sentence of the story schema's descriptions;
    the prompt, the prose layer and the schema each state the rule in their
    own words. The prose layer's addition names no agent by role.
  - The schema keeps every type, required entry and enum it has; the only
    declaration added is gaps_left.
  - The records the architecture document keeps of what earlier stories
    deferred stay as they were written.
  - No test invokes a model, bounds how long the machine takes, or pins a
    configurable value; a new test module is named for the behaviour it
    holds; helpers are imported from the modules that define them rather
    than copied; a module that starts reading this repository's history or
    its shipped files declares it in tests/test_baseline_honesty.py in the
    same change.
