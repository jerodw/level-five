      reason: The paragraph on per-stage changed-files records states that the documenter declares none and is intentionally unchecked; that is no longer true.

scope:
  modify:
    - workflows/story-workflow.json
    - prompts/documenter.md
    - tests/
    - .harness/docs/ARCHITECTURE.md
  do_not_modify:
    - orchestration/
    - schemas/
    - prompts/implementer.md
    - prompts/tester.md
    - prompts/verifier.md
    - prompts/harness-layer.md
    - prompts/planner.md
    - scripts/

verification_requirements:
  - Confirm the documenter stage's declaration in workflows/story-workflow.json matches the tester's shape - the record named in outputs, named by changed_files, and mapped to the changed-files schema - and that no other stage's declaration changed.
  - Confirm no file under orchestration/ appears in the diff, and that the blocked-path check reaching the documenter is therefore the existing declaration-driven code rather than new enforcement.
  - Confirm no new file was added under schemas/, and that the documenter's record is validated against schemas/changed-files.schema.json.
  - Confirm the escalation cases are exercised against a real coordinator run rather than asserted from the workflow file alone - a documenter that writes no record, one that writes a record naming a blocked path, and one that writes a record failing the schema each escalate, and a documenter writing a clean record does not.
  - Confirm the escalation assertions can fail - that each would have passed differently before the declaration was added, rather than passing for a reason unrelated to the documenter.
  - Confirm prompts/documenter.md contains {{changed_files_schema}} and names documenter-changed-files.json, and that the fields of the changed-files schema do not appear as prose in the template.
  - Confirm the full test suite passes, and that every tests/ module driving the shipped workflow through the documenter reaches its terminal state for the reason the test intends rather than escalating on the newly required artifact.

constraints:
  - The implementer's, tester's and verifier's declarations and enforcement are unchanged; this story adds one stage to a mechanism that already exists.
  - No stage name and no artifact name is added to orchestration/. The record name reaches the coordinator only by being read off the loaded workflow definition.
  - The changed-files schema is reused verbatim. The documenter's record has the same modified, created and deleted shape as the other two, and there is one definition of that shape in the repository.
  - The documenter's record is injected into no prompt template. No stage runs after the documenter, so nothing reads it inward.
  - {{changed_files}} continues to carry the implementer's record into every template that reads it, with unchanged meaning.
  - The documenter gains no may_not_create declaration, no revert check and no stage baseline. This story turns on the blocked-path check and nothing beyond it.
  - The documenter's own stage ordering is unchanged - it still runs last, after the verdict, before the coordinator commits.
