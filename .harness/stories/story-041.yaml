verification_requirements:
  - Confirm by search that orchestration/ names no language and no language's tooling in any identifier, string or docstring, and that no interpreter probe survives anywhere in it.
  - Confirm a non-Python runner produces a correct record by running the check against one - the recorded runner is the configured executable and the recorded exit code is the suite's - rather than by confirming the run did not raise. A record that is merely non-empty is what passes today and is not evidence.
  - Confirm the shipped configuration is unchanged in behaviour - this repository's own check resolves the same executable and builds the same command as it does today, differing only in the renamed key and the absent version.
  - Confirm a config carrying clean_clone_python is refused, that the message names both the retired key and verification_runner, and that the refusal leaves no run directory, no state file, no new branch and no agent invocation. Read the refused target's tree rather than the exit status alone.
  - Confirm the renamed key is proven to govern - its obedience proof passes against a varying value and goes red against the harness that stopped reading it - so the rename did not carry the coverage over in name only.
  - Confirm the scan reports nothing in orchestration/story_coordinator.py or in the three schemas, that TEMPORARY_TIES and PERMANENT_MENTIONS still equal what the scan reports in both directions, and that what remains temporary is the two prompt lines and the workflow restriction and nothing else.
  - Confirm no entry was removed from either tie list for a mention that is still present in source, by running the scan rather than by reading the diff.
  - Confirm the full suite passes with every pre-existing assertion intact, and that no assertion anywhere was weakened, skipped or deleted to accommodate the rename.

constraints:
  - The clean-clone check's purpose, its scratch clone, when it runs and what decides its result are unchanged. This story changes what is recorded and what the key is called, not what the check does.
  - _link_interpreter_roots is left alone. Its directory names already come from configured paths, which is the model this story is following rather than a problem it is fixing.
  - test_command stays as it is - configurable, language-neutral, and the source of every argument the check runs.
  - The first-word substitution is kept, not silently widened into a second command key. Its limit is stated where a reader meets it.
  - A retired key is never silently accepted as the new one and never silently ignored. It refuses, and the refusal names the replacement.
  - No language name enters orchestration/ or schemas/ by this story, including in the new refusal message and in every rewritten description.
  - Only the entries this story actually repairs come off TEMPORARY_TIES. The prompt lines and the workflow restriction stay, because the-test-location-comes-from-configuration removes them.
  - No assertion in the suite is weakened, skipped or deleted to accommodate the rename, and the mutation controls that make the existing clean-clone proofs non-vacuous keep working against the renamed code.
