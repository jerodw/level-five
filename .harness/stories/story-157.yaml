    - schemas/
    - workflows/
    - hooks/
    - templates/
    - tests/test_clean_clone_check.py
    - tests/conftest.py

verification_requirements:
  - Confirm the argument list of the `git clone` in `copy_repository` carries `--no-local` and no directory-copy flag, and that a test asserts it off the captured argument list.
  - Confirm every git command in `copy_repository` raises with git's stderr on failure and no `check=True` remains there, and that a test demonstrates the raised message carries git's words.
  - Confirm the five existing copy tests named in the acceptance criteria are textually unchanged against the story's base commit and pass.
  - Confirm no assertion anywhere in tests/ was weakened, skipped or removed.
  - Confirm the ARCHITECTURE.md change describes the code as it now stands and names no symbol that does not exist.

constraints:
  - Behaviour of a successful `copy_repository` call is unchanged: same history, HEAD, branch, working tree contents, index state and ignored-path exclusions as before.
  - No file outside tests/test_git_history_loading_retired.py and .harness/docs/ARCHITECTURE.md changes; `_build_clone` is the reference, not a subject.
  - Standard library only; the helper and tests use `subprocess`, `pytest` and the module's existing helpers.
  - Existing assertions are not edited, weakened or skipped to accommodate the change.

