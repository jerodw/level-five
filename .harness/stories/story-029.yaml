verification_requirements:
  - Confirm by running the new scan, rather than by inspection, that no module under tests/ constructs a module at runtime outside the single stated exemption.
  - Confirm each new scan reports its planted violation, since a scan without one asserts nothing about its own reach.
  - Confirm each new scan reports the four modules carrying the practice as they stand at this story's baseline revision. This is the only direct evidence the check would have caught what it is for.
  - Confirm the new construction scan reports a module that renames its helpers, since renaming is exactly how the scan being replaced was evaded.
  - Confirm the new scans state their own limits in writing and that the three named limits are among them, and that neither scan is described as drawing its enforcement from the other.
  - For each of the six restated comparisons individually, confirm the replacement assertion exists, names its subject explicitly, and fails when that subject is violated. Per assertion, not in aggregate.
  - For each of the four retargeted text-only assertions, confirm the subject, the strictness and the control are unchanged, and that no module is constructed.
  - For each of the two deleted defect reproductions, confirm the defect it demonstrated is recorded as frozen evidence a reader can find, and that an assertion reads that evidence. A defect whose only account was a deleted test has lost its account.
  - Confirm the restated comparison in tests/test_story_026_validation.py names the same commit pair the executed helpers named, with both ends checked against git.
  - Confirm test_reason_is_still_the_section_immediately_after_status still holds with its fixture split.
  - Confirm no private copy of the history reader, the mutation-loader or the script loader survives anywhere under tests/ outside the shared module.
  - Confirm the full suite passes, including the ten tests failing at this story's baseline, and that it passes because those tests were replaced and not because any shim was added or widened to make recovered modules runnable.
  - Confirm no assertion was weakened, skipped or deleted whose subject is not one of the recovery helpers, the module loaders, or a comparison this story restates.

constraints:
  - Every replacement assertion lands and is shown to fail on violation before the comparison it replaces is deleted. This ordering is the whole risk management of the story and is the repository's own rule.
  - Do not make the ten failing tests pass by freezing a copy of the workflow, schemas or config beside the frozen code. That would turn the failures green while deepening the practice being retired, and is the reason to write this story rather than an alternative to it.
  - Do not extend, widen or repair runnable_against_current_modules. It is deleted, not adapted.
  - Do not weaken, skip or delete any assertion whose subject is not one of the recovery helpers, the module loaders, or a comparison this story restates.
  - An assertion repointed onto the shared reader keeps its subject, its strictness, its output options and its controls. Repoint, never relax.
  - A per-story assertion repointed by this story is bounded at both ends of its own story's commit range, never with its after side read from the working tree. That trap has produced the same repair six times in this repository.
  - The scan is not claimed to be tamper-proof. An edit that deletes a check alongside a genuinely forced repair is not caught, at any granularity, because deleting the check that fails you satisfies the revert rule's own definition of a forced edit. Record this as a stated limit; do not attempt to close it here.
  - Nothing in orchestration/, workflows/, schemas/, prompts/ or scripts/ changes. This story's subject is the test suite and the document that describes it.
  - Leave story-028's subject, the retry routing table, untouched.
  - The archived evidence under .harness/runs-archive/story-013-vacuous-tests/ is read-only committed evidence and is not edited.
  - This story's own run is not governed by the scans it adds, since the suite it runs is the one it is changing. That is expected rather than a defect, and follows the pattern six earlier enforcement stories recorded.
