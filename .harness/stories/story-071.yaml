      stage: implementer
      reason: Renamed to `prompts/story-implementer.md`. Content unchanged.
    - file: prompts/verifier.md
      stage: implementer
      reason: Renamed to `prompts/story-verifier.md`. Content unchanged.
    - file: prompts/tester.md
      stage: implementer
      reason: Renamed to `prompts/story-tester.md`. Content unchanged.
    - file: workflows/story-workflow.json
      stage: implementer
      reason: The implementer, tester and verifier stages name the renamed prompts. This is the only place in the harness where the mapping from stage to prompt filename is written.
    - file: tests/test_prompt_workflow_ownership.py
      stage: implementer
      reason: The new standing check that the naming convention holds, with its negative controls.
    - file: tests/test_artifact_schemas.py
      stage: implementer
      reason: Iterates the three prompt filenames.
    - file: tests/test_changed_files_records.py
      stage: implementer
      reason: Reads the tester and verifier prompts by path.
    - file: tests/test_configured_test_location.py
      stage: implementer
      reason: Holds the tester prompt as a module constant and names it in prose.
    - file: tests/test_baseline_honesty.py
      stage: implementer
      reason: Names the tester and verifier prompts in prose and in the `TESTER_TEMPLATE` constant. Its `REPAIRED_SUBJECTS` entry naming `prompts/tester.md` is a past story's scope claim over a synthetic repository and stays as it is.
    - file: tests/test_coordinator_runs_the_suite.py
      stage: implementer
      reason: Reads the verifier and tester prompts as module constants and names them in prose.
    - file: tests/test_clean_clone_check.py
