scope:
  modify:
    - prompts/
    - workflows/story-workflow.json
    - tests/
    - .harness/docs/ARCHITECTURE.md
  do_not_modify:
    - .harness/stories/
    - tests/history-fixtures/
    - .harness/runs-archive/
    - orchestration/
    - scripts/
    - schemas/
    - workflows/refactor-workflow.json
    - templates/

verification_requirements:
  - Confirm the rename landed as a rename - the new filenames exist, the old ones do not, and the content of each moved file is unchanged from its predecessor.
  - Confirm every `prompt` value in both shipped workflow definitions resolves to a file that exists under `prompts/`, and that `refactor-workflow.json` was not edited.
  - Confirm no live reference to the old names survives under `tests/` except those that resolve against a fixture, a synthetic repository or a named past revision, and that each surviving one is correct for the revision it describes.
  - Confirm nothing under `.harness/stories/`, `tests/history-fixtures/` or `.harness/runs-archive/` was added, modified or deleted.
  - "Confirm `tests/test_documented_claim_support.py` still distinguishes its baseline text from its endpoint text: the baseline control must still be able to report, rather than passing because both branches now read the same thing or because a fixture read silently fell back."
  - Confirm `tests/test_prompt_workflow_ownership.py` checks what it claims to. Each assertion must be shown to report over an arrangement that breaks its rule, and the mapping it checks must be derived from the shipped workflow definitions rather than restated in the module.
  - Confirm the change is behaviour-preserving - that no assertion changed its subject or its strength, and that every edit under `tests/` is a filename substitution, a prose correction naming the same subject, or the new module.
  - Confirm the suite passes in a clean clone with the story committed.
  - Report on the census as evidence about the workflow rather than only about this story. A rename moves no counter, so the census permitting it is the expected result; a census that refused or that recorded a moved counter is a finding about `refactor-workflow` worth stating even though the story would otherwise pass.

constraints:
  - No behaviour change of any kind. If the suite would go red for a reason other than a moved filename, that is a finding to report rather than a thing to fix here.
  - Do not rename workflow stage names. `implementer` is a stage in both shipped workflows, so the stage name is correct in both; only the prompt files are ambiguous.
  - Do not rename check result artifacts. `revert-check-result.json` and its siblings are named for the check that writes them, and the check is what owns them.
  - Do not rename `prompts/documenter.md` or `prompts/planner.md`. Being unprefixed is a claim of shared ownership, not an absence of one, and renaming either would break the convention this story exists to make legible.
  - Preserve the content of every moved file exactly. A rename that also edits the prompt is no longer behaviour-preserving by construction, and the verifier cannot tell the two apart from the diff alone.
  - "`.claude/settings.local.json` mentions one of the old filenames and is deliberately out of scope: it is ignored by git, so it reaches no clone and is the developer's own local permission allowlist."
