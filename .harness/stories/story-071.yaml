story:
  id: story-071
  title: A prompt's filename says which workflow owns it
  description: |
    `prompts/` names its files after stages. That was unambiguous while one
    workflow shipped; since story-070 a second one does, and it brought
    `refactor-implementer.md` and `refactor-verifier.md` with it. The
    unprefixed names now silently mean "story-workflow's", which is tribal
    knowledge rather than something the filename says.

    This story renames the prompts a single workflow owns so the filename says
    which: `implementer.md` becomes `story-implementer.md`, `verifier.md`
    becomes `story-verifier.md`, and `tester.md` becomes `story-tester.md`.
    `documenter.md` and `planner.md` are deliberately not renamed, and that is
    the convention rather than an omission from it — `documenter.md` is named
    by both shipped workflows, and `planner.md` is the planning session's,
    outside any workflow. The rule story-070 recorded in
    `.harness/docs/ARCHITECTURE.md` is the one held to here: a prompt prefixed
    with a workflow's name belongs to that workflow; an unprefixed prompt is
    shared by every workflow.

    It runs under `refactor-workflow` and is the first real work for the
    workflow story-070 shipped. The fit is exact: the change is
    behaviour-preserving by construction and almost all of its edits are to
    tests, which is precisely the shape that cannot pass `story-workflow`'s
    revert check — reverting the test edits leaves the suite green, because the
    point of the edits is that nothing behaves differently. Stories 015, 016
    and 026 met that wall and each granted a `create` exception to disable a
    `modify` check. This one needs no grant at all. It is also a live exercise
    of the census: a rename moves no counter, so the census should permit it,
    and if it does not that is worth knowing before the workflow is trusted.

    The story adds one thing beyond the rename: a standing test module that
    asserts the convention over the shipped `prompts/` directory and the
    shipped workflow definitions. The convention has been prose in
    `ARCHITECTURE.md` since story-070, and this repository has twice recorded
    an injected written rule failing to hold. A check is what keeps it true
    after this story.
  workflow: refactor-workflow

tasks:
  - Rename `prompts/implementer.md` to `prompts/story-implementer.md`, `prompts/verifier.md` to `prompts/story-verifier.md`, and `prompts/tester.md` to `prompts/story-tester.md`, using `git mv` so the rename is recorded as one rather than as a delete and an add. Leave `prompts/documenter.md`, `prompts/planner.md`, `prompts/refactor-implementer.md`, `prompts/refactor-verifier.md`, `prompts/harness-layer.md`, `prompts/prose-layer.md` and `prompts/assist.md` exactly where they are.
  - Repoint the `prompt` values of the implementer, tester and verifier stages in `workflows/story-workflow.json` at the new filenames. This is the only change outside `tests/`, `prompts/` and the documentation - no module under `orchestration/` or `scripts/` names any of the three, because a stage's prompt filename reaches the code only off the loaded workflow definition. `scripts/l5-plan` names `planner.md`, which is not renamed.
  - Sweep the live references under `tests/` onto the new names. Both kinds count - string literals the suite resolves (path joins, `context_assembler.load_template` calls, `parametrize` lists, module-level template constants) and docstring or comment prose in a live module that names the file - so that no live module describes a file that does not exist.
  - Leave every reference that is about a past revision resolving to the old name. `tests/test_documented_claim_support.py` reaches its baseline text through a fixture filename derived from the prompt name, so its endpoint read takes the new name while the fixture keeps the old one and the call site holds both. `tests/test_baseline_honesty.py`'s `REPAIRED_SUBJECTS` and `tests/test_shared_baseline_resolution.py`'s scope parametrization name `prompts/tester.md` and `prompts/implementer.md` as subjects a past story's scope declared, and run against synthetic repositories rather than this one, so those strings stay as they are.
  - Add `tests/test_prompt_workflow_ownership.py`, a standing check of the convention: every file under `prompts/` that a single shipped workflow names carries that workflow's name as its filename prefix, every file named by more than one carries no prefix, and every prompt a shipped workflow names is a file that exists. Give it the negative controls this repository requires - each assertion re-run over a constructed arrangement that violates the rule, where it must report.
  - Update the convention paragraph in `.harness/docs/ARCHITECTURE.md` so it describes what the tree now holds. It currently records the rule and then names these prompts as still owed a prefix they do not carry, which this story discharges, and it should name the module that now checks the rule.

acceptance_criteria:
  - "`prompts/story-implementer.md`, `prompts/story-verifier.md` and `prompts/story-tester.md` exist and `prompts/implementer.md`, `prompts/verifier.md` and `prompts/tester.md` do not."
  - "`prompts/documenter.md` and `prompts/planner.md` are byte-identical to what they were before this story, and no other file under `prompts/` moved or changed name."
  - The implementer, tester and verifier stages of `workflows/story-workflow.json` name the new filenames, and every `prompt` value in both shipped workflow definitions resolves to a file that exists.
  - No file under `orchestration/` or `scripts/` mentions any of the old three names, and none needed to change for this story - `scripts/l5-plan`'s reference to `planner.md` is the only prompt filename in either directory and it is untouched.
  - The full suite passes, and no assertion changed its subject or its strength - every edit under `tests/` is a filename substitution, a prose correction naming the same subject, or the new module.
  - "`tests/test_prompt_workflow_ownership.py` exists and each of its assertions is shown to report over an arrangement that breaks the convention it checks: a single-workflow prompt with no prefix, a prefixed prompt named by a workflow other than its prefix, a shared prompt carrying a prefix, and a workflow naming a prompt file that is absent."
  - Nothing under `.harness/stories/`, `tests/history-fixtures/` or `.harness/runs-archive/` is added, modified or deleted. Those are execution records and recovered history: they name the old filenames correctly, as they stood at the revisions they describe.
  - A test that reads a historical revision of a prompt still reads the old name at that revision, and a test that reads the shipped prompt reads the new one. `tests/test_documented_claim_support.py` is the site where both meet, and its baseline control still distinguishes the two texts rather than passing vacuously.
  - The convention paragraph in `.harness/docs/ARCHITECTURE.md` no longer says these prompts are owed a prefix, and names the module that checks the rule.
  - The implementer's `census-result.json` records that the change moved no counter, and the census permitted the run.

technical_plan:
  implementation_steps:
    - "Run `git mv` for each of the three prompts, then edit the three `prompt` values in `workflows/story-workflow.json`. At this point the harness is consistent and only the suite is red."
    - Sweep `tests/` for the old names. The mechanical part is the executable literals; the judgement is deciding, for each hit, whether it names the shipped prompt or a past revision of it. The rule for the decision - if the read resolves against this repository as it now stands, it takes the new name; if it resolves against a fixture, a synthetic repository, or a named past revision, it does not.
    - "Attend to `tests/test_documented_claim_support.py:1480` first, because it is the one site where the rule cuts through a single function: `shipped_template` derives the baseline fixture's filename from the prompt name it is handed, so handing it the new name would look for a fixture that does not exist. The endpoint branch takes the new name, the baseline branch keeps `prompts-verifier.at-this-storys-baseline.md.txt`, and a comment says why the two disagree."
    - "Check `tests/test_refactor_workflow.py`'s `PRE_EXISTING_PROMPTS`. It reads the live `prompts/` directory, so it takes the new names even though it is phrased as a claim about what story-070 left alone; what story-070 left alone is these files, whatever they are now called."
    - Write `tests/test_prompt_workflow_ownership.py`. Derive the mapping from the shipped workflow definitions rather than restating it, so the module keeps checking when a third workflow arrives. Build each control by constructing a `prompts/` directory and workflow definitions in a temporary directory rather than by editing the shipped ones.
    - Run the suite. Any red the rename did not cause is reported in the implementation summary rather than fixed here.
