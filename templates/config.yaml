# Target-repository harness configuration (created by l5-init)
workflow: story-workflow
branch_prefix: story/
permission_mode: acceptEdits
# How long a run paused because capacity ran out may wait in place before the
# process exits, in seconds — five hours here. It bounds a wait whose length
# the harness has been told, and never becomes one it guesses: a capacity
# signal naming no reset time exits without sleeping whatever this says. Delete
# the key and the bound is zero, which never waits.
max_pause_wait_seconds: 18000
stories_dir: .harness/stories
runs_dir: .harness/runs
logs_dir: .harness/logs
standards_dir: .harness/standards
architecture_docs:
  - .harness/docs/ARCHITECTURE.md
test_command: {test_command}
# How the harness files an outbox entry: one command, invoked once per entry,
# through which it knows nothing else about the tracker. The entry goes to it
# on stdin as JSON and its key is in the environment as L5_SYNC_KEY; the last
# non-empty line of stdout is the reference, recorded and never parsed; exit 0
# lands the entry, exit 75 leaves it pending for a later sync, and any other
# non-zero code fails it terminally. The command must be idempotent given the
# key — it searches by that key before it creates — which is what makes a lost
# response safe to retry, and it must not commit. l5-init installs a reference
# implementation at .harness/sync/github.sh; read its header for the whole
# contract before writing your own. Both keys are commented out so a freshly
# initialized repository opts in to filing rather than discovering that it
# files: uncomment sync_command and nothing else changes until you do.
# sync_command: .harness/sync/github.sh
# How long that command may run before it is killed, in seconds. The kill
# reaches its process group, so a command that spawned children leaves none
# behind. Delete the key and the bound is 60 seconds — a real one, because a
# timeout of zero would be no timeout at all.
# sync_timeout_seconds: 60
# How many pending entries one sweep of the outbox attempts to file. It counts
# filing attempts, not entries read, so a queue of landed, failed or poisoned
# entries is fully reported however small this is. What the bound leaves is
# named in what the sweep reports rather than truncated silently. The worst
# case of one sweep is this multiplied by sync_timeout_seconds, and the
# opportunistic sweeps sit in front of a run and after its completion commit —
# so raise one only having considered the other. Delete the key and the bound
# is 20.
# sweep_max_entries: 20
# The other half of the pair: how the harness asks what is already filed. ONE
# COMMAND ANSWERING TWO QUESTIONS, invoked once per question, told which by what
# the question document on stdin carries. Carrying "paths" it is the dedupe
# question, so that a producer of findings does not file the same one on every
# run, and it is answered in the shape of schemas/filed-items.schema.json.
# Carrying "key" it is the fetch question — one brief, by the key this command
# itself reported for it — so that l5-plan --brief can plan a brief that was
# filed rather than have it retyped, and it is answered in the shape of
# schemas/fetched-brief.schema.json, whole and unbounded, because a truncated
# brief is a brief that plans wrong. An answer to that one carrying no brief
# says the key resolved to nothing, which is a different answer from failing to
# answer. Either way stdout is a single JSON document and nothing else, so every
# diagnostic belongs on stderr; exit 0 means it answered and any other code
# means it could not. A failed dedupe question cannot fail a run — it costs
# dedupe and nothing else — while a failed fetch refuses that l5-plan invocation
# before anything is written, and the request can be given as text instead.
# l5-init installs a reference implementation at .harness/query/github.sh beside
# the sync one. THE TWO ARE A PAIR the harness requires and cannot enforce —
# they must agree about where a path and a payload are recorded in a tracker
# item, and a target that sets one without the other simply gets no dedupe.
# filed_query_command: .harness/query/github.sh
# How long that command may run before it is killed, in seconds. The kill
# reaches its process group, so a command that spawned children leaves none
# behind. Delete the key and the bound is 30 seconds — a real one, because a
# timeout of zero would be no timeout at all.
# filed_query_timeout_seconds: 30
# How many items the harness reads out of one answer. Excess items are dropped
# keeping the command's own order, and what was dropped is named in the answer
# rather than truncated silently. Delete the key and the bound is 50.
# filed_query_max_items: 50
# The parts of this repository's own source l5-inspect covers when you name no
# scope on the command line. One agent invocation is made per entry, so
# declaring them is what turns an inspection into several coherent invocations
# instead of one agent handed the whole tree. Delete the key and the scope is
# everything git tracks minus the blocked paths and minus tests_dir. Tests are
# inspected either way, as a scope of their own beside these: source and tests
# are a union and not a merge, and setting this decides nothing about the
# create restriction tests_dir governs.
# source_dirs:
#   - src/
# How many briefs one whole inspection may file, across every scope it covered.
# What the cap excludes is reported with how many were dropped and the severity
# of each, and the ones kept are the highest-severity rather than the first
# written. Delete the key and the bound is 10.
# inspect_max_findings: 10
# What one Inspector invocation may spend, in US dollars. It is handed to the
# invocation so the invocation stops itself rather than being stopped after the
# fact, and it is per scope rather than per inspection — an inspection over
# four scopes may spend four of these, and the report says how many invocations
# it made. Delete the key and the allowance is 5.0.
# inspect_max_cost_usd: 5.0
# Where this repository's tests live, as a path prefix ending in a slash. It is
# what the workflow's {{tests_dir}} token resolves to: the stage restricted from
# creating tests is restricted here, and the stage that writes them is told to
# write them here. A starter value like every other line in this file — change
# it to wherever this repository actually keeps its tests. There is no default:
# delete the key and this repository declares no test directory at all, and the
# restriction resolves out of the workflow entirely.
tests_dir: tests/
# Bash commands stage agents may run without prompting. Headless agents
# cannot answer permission prompts. Read-only search and inspection is
# granted broadly: a denial costs a turn and buys nothing, because the
# harness's own rules are enforced by the coordinator after a stage has
# run, not by this list. Mutation is denied by hooks/bash_guard.py, which
# ships with the harness and is passed to every stage invocation, rather
# than by these entries happening to omit it.
allowed_tools:
  - "Bash(git status:*)"
  - "Bash(git diff:*)"
  - "Bash(git log:*)"
  - "Bash(ls:*)"
  - "Bash(cat:*)"
  - "Bash(grep:*)"
  - "Bash(rg:*)"
  - "Bash(find:*)"
  - "Bash(head:*)"
  - "Bash(tail:*)"
  - "Bash(wc:*)"
  - "Bash(sort:*)"
  - "Bash(uniq:*)"
  - "Bash(diff:*)"
  - "Bash(git show:*)"
  - "Bash(git branch:*)"
  - "Bash(git ls-files:*)"
