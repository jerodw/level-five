# Target-repository harness configuration (created by l5-init)
workflow: story-workflow
branch_prefix: story/
permission_mode: acceptEdits
# How long a run paused because capacity ran out may wait in place before the
# process exits, in seconds — five hours here. It bounds a wait whose length
# the harness has been told, and never becomes one it guesses: a capacity
# signal naming no reset time exits without sleeping whatever this says. Delete
# the key and the bound is zero, which never waits.
max_pause_wait_seconds: 18000
stories_dir: .harness/stories
runs_dir: .harness/runs
logs_dir: .harness/logs
standards_dir: .harness/standards
architecture_docs:
  - .harness/docs/ARCHITECTURE.md
test_command: {test_command}
# How the harness files an outbox entry: one command, invoked once per entry,
# through which it knows nothing else about the tracker. The entry goes to it
# on stdin as JSON and its key is in the environment as L5_SYNC_KEY; the last
# non-empty line of stdout is the reference, recorded and never parsed; exit 0
# lands the entry, exit 75 leaves it pending for a later sync, and any other
# non-zero code fails it terminally. The command must be idempotent given the
# key — it searches by that key before it creates — which is what makes a lost
# response safe to retry, and it must not commit. l5-init installs a reference
# implementation at .harness/sync/github.sh; read its header for the whole
# contract before writing your own. Both keys are commented out so a freshly
# initialized repository opts in to filing rather than discovering that it
# files: uncomment sync_command and nothing else changes until you do.
# sync_command: .harness/sync/github.sh
# How long that command may run before it is killed, in seconds. The kill
# reaches its process group, so a command that spawned children leaves none
# behind. Delete the key and the bound is 60 seconds — a real one, because a
# timeout of zero would be no timeout at all.
# sync_timeout_seconds: 60
# Where this repository's tests live, as a path prefix ending in a slash. It is
# what the workflow's {{tests_dir}} token resolves to: the stage restricted from
# creating tests is restricted here, and the stage that writes them is told to
# write them here. A starter value like every other line in this file — change
# it to wherever this repository actually keeps its tests. There is no default:
# delete the key and this repository declares no test directory at all, and the
# restriction resolves out of the workflow entirely.
tests_dir: tests/
# Bash commands stage agents may run without prompting. Headless agents
# cannot answer permission prompts. Read-only search and inspection is
# granted broadly: a denial costs a turn and buys nothing, because the
# harness's own rules are enforced by the coordinator after a stage has
# run, not by this list. Mutation is denied by hooks/bash_guard.py, which
# ships with the harness and is passed to every stage invocation, rather
# than by these entries happening to omit it.
allowed_tools:
  - "Bash(git status:*)"
  - "Bash(git diff:*)"
  - "Bash(git log:*)"
  - "Bash(ls:*)"
  - "Bash(cat:*)"
  - "Bash(grep:*)"
  - "Bash(rg:*)"
  - "Bash(find:*)"
  - "Bash(head:*)"
  - "Bash(tail:*)"
  - "Bash(wc:*)"
  - "Bash(sort:*)"
  - "Bash(uniq:*)"
  - "Bash(diff:*)"
  - "Bash(git show:*)"
  - "Bash(git branch:*)"
  - "Bash(git ls-files:*)"
